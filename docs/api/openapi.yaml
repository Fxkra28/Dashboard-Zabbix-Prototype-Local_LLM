openapi: 3.1.0

# Written 22 September 2026 by reading server/src, not by transcribing setup.md §5: that table
# drifted twice (DOC-14, DOC-15) precisely because nothing checked it against the code.
#
# `tools/check/openapi.check.ts` compares every app.get/app.post registration in server/src with the
# operations below: the path and the method, the path parameters, and the 401, 403 and 400 that each
# guarded or body-taking operation must document. It fails on any difference. Run it after touching either.
#
# The two copies of this file differ only in the `servers:` port, 8082 here and 8081 in
# hcml-portal, and in this comment, which names both. Everything else must stay byte-identical.

info:
  title: HCML Monitoring Portal (BFF)
  version: 1.0.0
  summary: A read-only backend-for-frontend over the Zabbix 7.0 JSON-RPC API.
  description: |
    The portal owns no database. Every response below is either passed through from Zabbix or
    derived in-process and cached in an LRU of at most 500 entries or about 64 MB, whichever is
    reached first, that is lost on restart. Sites, links,
    incidents, host reachability and the monthly SLA have no table anywhere.

    **One write exists** in the whole surface: `POST /api/problems/acknowledge`. It uses a separate
    write-capable Zabbix token and is refused with 503 when that token is unset.

    ### Authentication

    One credential, a JWT carrying `{ sub, role, ep, jti, sid }` that lasts 12 hours unless `SESSION_HOURS` sets another
    length (2 to 24), presented one of two ways.
    Every guarded path takes either:

    - `sessionCookie`, the browser's way. `POST /api/auth/login`, `POST /api/auth/refresh` and `POST /api/auth/password` set it
      with `Set-Cookie`: `HttpOnly`, `SameSite=Strict`, `Path=/`, a `Max-Age` equal to the session length
      (43200 at the default 12 hours), and `Secure` when
      the request arrived over HTTPS. No script on the page can read it, and no response body carries
      the token. An open portal renews it with `POST /api/auth/refresh` an hour before it runs out;
      `POST /api/auth/logout` clears it.
    - `bearerAuth`, `Authorization: Bearer <jwt>`, for scripts and tests. A script takes the token
      from the login response's `Set-Cookie` header. When a request carries both, the header wins.

    No path takes a token in the query string, `/api/stream` included: `EventSource` sends the cookie
    like any same-origin request, so a `?token=` gets 401. `logging.ts` and nginx still redact one
    from their logs, for pages loaded before the cookie change.

    **Forgery check.** A `POST`, `PUT`, `PATCH` or `DELETE` on `/api/*` that authenticates with the
    cookie, and every call to `POST /api/auth/login`, `POST /api/auth/logout` and `POST /api/auth/request`, must carry the
    header `X-HCML-CSRF: 1`. When the browser sends an `Origin`, it must name the request's own host
    and port. Anything else gets `403 csrf` (`CsrfRefused`), before the guard runs and with auth on
    or off. A request with a Bearer header is not checked, except on sign-in, sign-out and the request for an account, since a browser
    never adds one by itself.
    `csrfRefusal` in `security/auth.ts`; ADR-0010.

    The guard judges the route the router matched, not the URL text, so a percent-encoded path such
    as `/%61pi/hosts` is guarded like `/api/hosts`. Only `/api/health`, `/api/auth/login`,
    `/api/auth/me`, `/api/auth/logout` and `/api/auth/request` are outside it, matched exactly. The last is the one public
    route that writes to disk, and it is off unless `ACCOUNT_REQUESTS=true`.

    When `AUTH_ENABLED=false` no route is guarded at all and every caller is treated as `admin`. The
    forgery check still applies to sign-in, sign-out and the request for an account.

    ### Roles

    OpenAPI cannot express a role or a module per path, so each operation states what it needs in its
    description. Who may use a route is two things (ADR-0017): a **role**, which says what the user may do, and
    the **modules** the user holds, which say what they may see. The table of routes in
    `server/src/security/modules.ts` gives each route the modules that own it (holding any one is enough) and the role it
    needs; first match wins, and a route with no row is closed to everyone but administrators. An administrator holds every module.

    | Role | What it adds |
    |---|---|
    | `guest` | Reads. |
    | `operator` | `POST /api/problems/acknowledge`. |
    | `admin` | `/api/users*`, `/api/reports/inventory`, `/api/sli/email`, `/api/sli/schedule`, `/api/sli/recipients`. |

    The ranks run guest, operator, admin, and a role passes every rule below its own. The pages of the menu are the modules: the Dashboard, Problems, Sites, Hosts, Devices,
    Latest data, Graphs, Maps, Network, Links & WAN health, Services, SLA, Capacity trends, Alert noise, Top 100 triggers, Inventory & ownership scorecard, the Assistant,
    and Users and access. `/api/net/*` belongs to the Network module and `/api/links` to Links & WAN health; the routes that two pages share belong to both. The names `viewer` and `wall`
    that `.env` and older sessions carry still read: as a guest, a `wall` account with the Network and Links pages as well.

    ### Errors

    Every error, at every status, is `{ "error": string, "message": string, "requestId": string }`. There
    is no `statusCode` in the body and no other field. `requestId` is the reply's `X-Request-Id` (see
    Request ids below), so a person who reads it out lets an admin find the request in the logs.

    ### Request ids

    Every reply, at every status and on the live stream too, carries an `X-Request-Id` header. nginx makes
    the id for each request (`$request_id`, 32 hex characters), replacing any value the client sent, and
    the BFF uses it: it is `reqId` on every BFF log line of the request, the header on the reply, and
    `requestId` in the body of an error. nginx writes it in its own access log as `rid=`. A request that
    reaches the BFF some other way keeps a sent id only when it is 8 to 64 characters of letters, digits,
    `.`, `_` and `-`, and gets a new one otherwise.

    Two pairs are easy to conflate and are deliberately different:

    - A rejected portal JWT is `401 unauthorized`. A rejected Zabbix API token is
      `503 zabbix_auth`. Different tokens, different codes.
    - An unreachable or erroring Zabbix is `502 zabbix_error`; a Zabbix that does not answer within
      `ZABBIX_TIMEOUT_MS` is `503 zabbix_timeout`. **Nothing in this server ever returns 504.**

    ### Sign-in off

    With `AUTH_ENABLED=false` (local development only) every caller is admin, so the server answers
    only to a `Host` header that names this machine: `localhost`, `127.0.0.1`, `::1` or the
    `WEB_ORIGIN` host, on any port. Any other `Host` gets `421 misdirected_request`, which stops a
    page on another site that points its own domain at 127.0.0.1 (DNS rebinding). With sign-in on
    this does nothing, a token is checked instead.

    ### Compression

    JSON responses of 1024 bytes or more are compressed with brotli (quality 4) or gzip (level 6);
    brotli wins ties. `Vary: Accept-Encoding` is set on every eligible JSON response whether or not
    compression actually happened. The two SSE paths bypass the hook entirely.

    ### Stale answers

    The slow reports are served with `staleIfError`: `/api/reports/availability`,
    `/api/reports/noise`, `/api/reports/capacity`, and the derived monthly SLA behind `/api/sli`,
    `/api/sli/export`, `/api/services/derived` and `/api/explain/sla` with `source=derived`. When
    Zabbix fails they return **200 with an old copy, of any age**, rather than 502/503. The status code
    does not say so, but two response headers do:

    - `X-Data-Stale: true`
    - `X-Data-Age-Seconds: <how old the copy is, in seconds>`

    They appear only on an answer that read an old copy kept because Zabbix failed, never on a live
    answer, a cache hit or an error, and the JSON body is not changed. When one request read several
    cached reports, the age is that of the oldest. A cached answer that was itself built on a stale
    report, `/api/services/derived` for its 30 s and `/api/explain/sla`, is not flagged again.

    HCML's Zabbix takes tens of seconds to build some views, so past their cache time these answer at
    once with their last copy while one refresh runs, for up to 10 minutes: `/api/hosts/overview`,
    `/api/devices`, `/api/net/devices`, `/api/net/interfaces`, `/api/net/meters`,
    `/api/reports/top-hosts`, `/api/reports/web-monitoring`, `/api/services`, `/api/services/derived`,
    `/api/maps/detail`, `/api/sla` and `/api/sla/sli`, and, for as long as their cache time again,
    `/api/reports/availability` (a window, or `basis=all-problems`), `/api/reports/noise` and
    `/api/reports/capacity` (a day for the last). Such an answer carries

    - `X-Data-Refreshing: true`
    - `X-Data-Age-Seconds: <how old the copy is, in seconds>`

    and never `X-Data-Stale`, which wins when one request saw both. The problem list is never served
    this way. The derived monthly SLA behind `/api/sli`, `/api/sli/export`, `/api/explain/sla` and a
    `month` of `/api/reports/availability` with the default basis is also answered from its old copy
    while a new one is built, but without these two headers. The body of `/api/sli` carries `generatedAt`,
    and the SLA page prints it; the body of the availability report has no such field, so a script that
    needs the age of a month reads it from `/api/sli`.

    ### Reads dropped when the reader leaves

    A slow read that is still waiting for its place when the connection of the person who asked closes
    is never started, and the answer that nobody reads is **499 `cancelled`** (`Cancelled` in
    `core/gate.ts`). Only a script that gives up can see it. It is documented on the nine routes that can
    drop a read: `/api/sli`, `/api/sli/export`, `/api/reports/availability`, `/api/reports/noise`, `/api/reports/capacity`,
    `/api/reports/top-triggers`, `/api/services/derived` and the two Explain routes, where it also ends a model call that is running. A read that has
    already started finishes and is kept for the next reader, except a model call that nobody waits for any more.
  contact:
    name: HCML Monitoring Portal
    url: https://github.com/Fxkra28/Dashboard-Zabbix-Prototype

servers:
  - url: http://localhost:4000
    description: BFF directly, local development
  - url: http://localhost:8082/bff
    description: Through nginx in the Docker deployment

tags:
  - name: Meta
    description: Health, readiness and authentication. `/api/ready`, `/api/auth/refresh` and `/api/auth/password` are guarded; `/api/health`, `/api/auth/login`, `/api/auth/me`, `/api/auth/logout` and `/api/auth/request` are public.
  - name: Hosts
    description: Hosts, groups, items and latest values. `server/src/routes/hosts.ts`
  - name: Problems
    description: Open problems and the live stream.
  - name: History
    description: The downsampled graph series, from raw history or hourly trends.
  - name: Network
    description: Devices, interfaces and ports. **Network page.** `server/src/routes/net.ts`
  - name: Reports
    description: Top triggers, stats, availability, noise, aging, capacity, inventory.
  - name: Sites
    description: The derived site view. No Zabbix entity corresponds to a site.
  - name: Services
    description: Zabbix-native service tree, and the portal's derived equivalent.
  - name: SLA
    description: Zabbix-native SLA, and the portal's derived monthly SLI.
  - name: Maps
    description: Zabbix network maps.
  - name: AI
    description: The plain-language layer. On demand only, never called on page load.
  - name: Users
    description: The portal's users, their roles and their modules (ADR-0017). **admin.** `server/src/routes/users.ts`

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /api/health:
    get:
      summary: Liveness, build and readiness
      description: |
        Unguarded and not rate limited, like `POST /api/auth/logout`. Registered before the auth guard
        (`registerHealth` in `index.ts`) and in the rate limiter's allow-list, so it answers even when Zabbix is down.
        The status stays 200 then too: `ok` means the process answers, and `ready` says whether Zabbix
        does.

        `ready` comes from one `host.get` (`output: hostid`, `limit: 1`) with the read-only token, given
        up after 2 s, one at a time, and kept for 15 s. A result 15 to 60 s old is returned at once while
        a new check runs behind it; an older one makes the caller wait. For a local model the same check
        reads `GET {AI_BASE_URL}/models` once, with the model key when one is set. The hosted Anthropic model
        is not probed, and the model never changes `ready.ok`. `apiinfo.version` is not used: Zabbix refuses it
        when called with a token, and the Zabbix version is not worth publishing here.

        `writeBack` tells the UI whether to render the acknowledge and close buttons.

        The route is public, so anyone gets the liveness fields (`ok`, `ts`, `ai`, `aiProvider`,
        `aiExternal`, `writeBack`, `defaults`) and none of them holds a URL, host name, token or error
        text. A caller who is signed in, by cookie or Bearer header, also gets `version`, `startedAt`,
        `build`, `ready` as the whole check and `streams`: an anonymous caller must not learn the build, when the portal
        restarted, how many screens are open, or why Zabbix cannot be read (a revoked token reads as any other failure). Anyone
        gets `ready` as a plain `true` or `false`, so a monitor needs no account. A bad or missing
        token is never a 401 here, it just gets the short answer. With sign-in off every caller counts as signed in. The container
        healthcheck sends no sign-in and reads only the status.
      operationId: getHealth
      tags: [Meta]
      security: []
      responses:
        '200':
          description: Always.
          content:
            application/json:
              schema:
                type: object
                required: [ok, ts, ai, aiProvider, aiExternal, writeBack, defaults, ready]
                properties:
                  ok: { type: boolean, const: true }
                  ts: { type: integer, description: 'Server time, milliseconds since epoch.' }
                  ai: { type: boolean, description: Whether the plain-language layer is configured. }
                  aiProvider:
                    type: string
                    enum: [anthropic, openai-compatible]
                    description: Which backend answers, `AI_PROVIDER`. The page uses it to name the service in the notice below.
                  aiExternal:
                    type: boolean
                    description: |
                      Whether a question leaves this machine's own network: true when the hosted Anthropic backend is configured, or when
                      the model is on a host that is not local (`AI_BASE_URL` names a public address) or has a name that Ollama sends to ollama.com (it ends in `cloud` after a colon, an underscore or a hyphen, as `kimi-k2:cloud` does). The Assistant and Explain then say so
                      next to every answer; a model on this machine, on a private address or on a name that only resolves inside a
                      network shows nothing.
                  writeBack:
                    type: boolean
                    description: Whether write-back is on, which is `ZABBIX_WRITE_TOKEN` set and either sign-in on or `ALLOW_WRITE_WITHOUT_AUTH=true`. False means acknowledge returns 503.
                  defaults:
                    type: object
                    required: [availabilityMinSeverity, timezone]
                    properties:
                      availabilityMinSeverity: { type: integer, minimum: 0, maximum: 5 }
                      timezone:
                        type: string
                        description: The SLA time zone, `SLA_TIMEZONE`. The web app labels times and cuts its month lists in it.
                  version: { type: string, description: Signed-in callers only. The server package version. }
                  startedAt: { type: string, format: date-time, description: Signed-in callers only. When this process started. }
                  build:
                    type: object
                    required: [commit, time]
                    description: |
                      Signed-in callers only. The image's `BUILD_COMMIT` and `BUILD_TIME` build arguments (compose's `build.args`).
                      `unknown` when not given or empty, and cut to 64 characters.
                    properties:
                      commit: { type: string }
                      time: { type: string }
                  ready:
                    description: |
                      Whether the portal can read Zabbix. Anyone gets a plain boolean (the model never changes it). A signed-in caller gets
                      the whole check instead, as the object below.
                    oneOf:
                      - type: boolean
                      - type: object
                        required: [ok, zabbix, zabbixMs, model, checkedAt]
                        properties:
                          ok: { type: boolean, description: The portal can read Zabbix. The model never changes it. }
                          zabbix: { type: string, enum: [ok, token_rejected, timeout, error] }
                          zabbixMs:
                            type: [integer, 'null']
                            description: How long the Zabbix call took. Null when it did not answer.
                          model:
                            type: string
                            enum: [ok, down, missing, off, not_checked]
                            description: '`off` is no model configured, `missing` is a model server that answers without `AI_MODEL` in its list (a forgotten `ollama pull`, a mistyped name), `not_checked` is the hosted Anthropic model, which a probe would bill.'
                          checkedAt: { type: integer, description: 'When these answers were read, milliseconds since epoch.' }
                  streams: { type: integer, minimum: 0, description: Signed-in callers only. Screens connected to `/api/stream` right now. }
                  logFile:
                    allOf: [{ $ref: '#/components/schemas/LogFile' }]
                    description: Signed-in callers only. Whether the server's own log file is being written.

  /api/ready:
    get:
      summary: Whether the portal can read Zabbix, as a status code
      description: |
        For a monitor that holds a session cookie or a Bearer token, so it is guarded like any route and
        needs `guest`. `GET /api/health` always answers 200 and says inside `ready` whether Zabbix does;
        this answers `503` while the portal cannot read Zabbix, so a status check is enough.

        It reads the same cached check as `/api/health`: one `host.get` with the read-only token, given up
        after 2 s, one at a time, kept for 15 s. Asking both, or asking often, costs Zabbix at most one call
        in 15 s. The model never changes the status: the AI layer is optional, and `model` only reports it.

        The body is the same at both statuses: the check's own fields, as `ready` carries them in
        `/api/health`, and the version, start time, build and screens a signed-in `/api/health` carries.
        It holds no address, token or error text. The status says whether to worry, `zabbix` says why.
      operationId: getReady
      tags: [Meta]
      responses:
        '200':
          description: Zabbix answered the read-only token's call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: The portal cannot read Zabbix. `zabbix` says why (`token_rejected`, `timeout` or `error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }

  /api/auth/login:
    post:
      summary: Exchange credentials for a session cookie
      description: |
        Registered before the guard, so it is reachable unauthenticated. Rate-limited twice,
        deliberately, since it is otherwise an unthrottled password oracle: the global limit, and 10
        attempts a minute per account and address of its own (`LOGIN_ATTEMPTS_PER_MINUTE` in `auth.ts`).
        After 10 failures in a row for one account from one address, sign-in is locked for a minute,
        doubling with each further failure up to 5 minutes; a success clears it. An address that fails 30 times within 15 minutes, across at least 10 different names, is locked the same way
        whatever the names: a password tried once against many accounts never trips the lock of one (SC-61; `SPRAY_FAILURES` and `SPRAY_NAMES` in `auth.ts`). All answer 429 with
        `Retry-After`.

        Credentials come from the file of users (`users.json` in the data folder, managed on the Users page) and from `.env`: `PORTAL_USERS` (comma-separated
        `name:password:role` triples) or `PORTAL_USER`/`PORTAL_PASS` as a single-admin shorthand, whose first administrator always signs in from `.env` (ADR-0017). A password is plain text or an Argon2id
        hash (`argon2id.m.t.p.salt.hash`, or an older `scrypt.N.r.p.salt.hash`, made by `server/scripts/hash-password.ts`), and either is compared
        in constant time. A plain one is still plain text in the environment. A disabled user, and one past their expiry, is refused with the same 401 as a wrong password. Where hashes are in use, a name nobody has costs as long to refuse as a wrong password for a name
        that exists, so the time of the answer does not say which names are real (SC-60).

        The token goes into the session cookie, never the body. Needs `X-HCML-CSRF: 1`, with or
        without a cookie, and with auth off too: a refused sign-in gets 403 and sets no cookie.

        The body must be a JSON object with a text `username` and a text `password`. One that is not,
        for example a missing field or a number, is a 400 `bad_request`, not a 401, and does not count
        as a failed sign-in. Empty text is still a wrong password: 401. Other fields are ignored.
      operationId: login
      tags: [Meta]
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: '`invalid_credentials`, no user has that name and password.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403': { $ref: '#/components/responses/CsrfRefused' }
        '413':
          description: '`fst_err_ctp_body_too_large`: a sign-in body over 4 KB (`LOGIN_BODY_LIMIT` in `auth.ts`).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }

  /api/auth/me:
    get:
      summary: Who the current session says you are, and how long it has left
      description: |
        Self-verifying: registered before the guard and calls `jwtVerify()` itself, on the cookie or
        a Bearer header. Drives the sidebar's filter, which is cosmetic: the BFF enforces with a
        403 regardless. `pages` gives the pages this user has, each with the role it needs, worked out from the table of routes
        (`modules.ts`), so the sidebar keeps no second copy of it, and a page the user lacks is not in it. `modules` is the list of the modules the user holds.
        The role and the modules are those of now, not those the session began with. `expiresIn` is relative,
        so the page times its renewal without trusting its own clock. `mustChange` is present, and true, when the password is a temporary one: nothing else can be read until it is changed.
        `user.source` says where the account is kept, `file` for the file of users and `env` for `.env`: one of `.env` cannot change its password on the Account page (FR-73).
        The web app asks again when its tab is shown or gains focus (at most once a minute), after each renewal, and every ten minutes while the page stays in view, so a page an
        administrator gives or takes away reaches a screen that is already open (FR-70).

        When `AUTH_ENABLED=false` this returns `{ authEnabled: false, user: { name: "anonymous",
        role: "admin" }, expiresIn: null, pages, modules }`, with every module but the Users page. `user` is **never** null, despite `web/src/types/auth.ts`
        allowing it.
      operationId: getMe
      tags: [Meta]
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema:
                type: object
                required: [authEnabled, user, expiresIn, pages, modules]
                properties:
                  authEnabled: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }
                  expiresIn:
                    type: [integer, 'null']
                    minimum: 0
                    description: Seconds until the session ends. Null with auth off.
                  pages:
                    type: object
                    description: The pages this user has, by path such as `/network`, each with the minimum role it needs. A page the user lacks is not here.
                    additionalProperties: { type: string, enum: [guest, operator, admin] }
                  modules:
                    type: array
                    description: The modules the user holds, by id.
                    items: { $ref: '#/components/schemas/ModuleId' }
                  mustChange: { type: boolean, description: 'True when the password is a temporary one that must be changed first.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/refresh:
    post:
      summary: Swap a valid session for a fresh one
      description: |
        Keeps an open portal signed in, for every user, for as long as the page stays open
        (DESIGN.md section 9, "Wall sign-in"; ADR-0009). The web app calls it an hour before the
        session ends, timed from the `expiresIn` of the last sign-in, renewal or `GET /api/auth/me`.
        A closed tab renews nothing.

        Behind the guard, so it takes the cookie or a Bearer header; a `?token=` is refused like on
        every route. A cookie renewal is a cookie POST and needs `X-HCML-CSRF: 1`; a Bearer renewal
        does not. The user is looked up again in the current user list: one removed from
        `PORTAL_USERS`, a name listed there twice, a user disabled on the Users page and one past their expiry get 401 and no cookie, and the new token carries
        the role configured now, not the one in the old token. It takes no body: none, or a JSON
        object that is ignored. Any other JSON body is a 400. Registered only when
        `AUTH_ENABLED=true`; otherwise 404.
      operationId: refreshToken
      tags: [Meta]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        description: Ignored. Nothing, or a JSON object.
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Renewed. The session cookie is set again with a fresh token.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/password:
    post:
      summary: Change your own password
      description: |
        For a user of the file of users (ADR-0017); a user kept in `.env`, the first administrator, is refused with 409, since their password is changed there, and the Account page shows
        a sentence instead of the form for them (`user.source` of `GET /api/auth/me`, FR-73). Asks for the current password, which is
        tried at most 10 times a minute for each user, and for a new one that is at least 8 and at most 256 characters, not on the lists of passwords that anyone can guess (the common ones, one of their base words with digits or signs after it, or one character repeated), and not holding `hcml` or the sign-in name, and that is not the current one. A change ends every older
        session of the person, renews this one (the new session cookie is set, as for `POST /api/auth/refresh`), and clears `mustChange`. It is the one call, with sign-out, renewal and
        `GET /api/auth/me`, that a user with a temporary password may make. It needs `X-HCML-CSRF: 1` with a cookie. The log gets one line, never the password.
      operationId: changePassword
      tags: [Meta]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Changed. The session cookie is set again with a fresh token.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Session' }
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRefused' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      summary: Sign out by clearing the session cookie
      description: |
        Public, so a missing or expired cookie can still be cleared: answers 200 with or without one,
        and with auth off. The `Set-Cookie` header empties the cookie with the attributes it was set
        with. It also ends the session on the server: every token of that sign-in, the ones a renewal gave
        too, is refused from then on (a list in memory, which a restart forgets), and the live streams of
        the session are closed at once. A copy of a token that someone keeps renewing after the owner only
        closed the tab, without signing out, works until the user is disabled on the Users page (or, for a user of `.env` alone, taken out of `PORTAL_USERS` and the container recreated), a new
        `JWT_SECRET` is set, or a higher `SESSION_EPOCH` is set and the server restarted (SC-14); there is no
        absolute age, because a wall screen must stay signed in. A live stream also ends when its token expires, and the browser reconnects (SC-15). Needs `X-HCML-CSRF: 1` like any POST that touches the cookie. It takes no body: none, or a JSON object that is ignored. Any other JSON body is a 400.
      operationId: logout
      tags: [Meta]
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        description: Ignored. Nothing, or a JSON object.
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              description: |
                The session cookie, emptied: `Max-Age=0` and an `Expires` in 1970, with the same
                `Path`, `HttpOnly`, `SameSite` and `Secure` it was set with.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CsrfRefused' }

  /api/auth/request:
    get:
      summary: Whether the sign-in page offers a request for an account, and for which pages
      description: |
        Public, like sign-in. Answers `{ "enabled": false }` unless `ACCOUNT_REQUESTS=true`, sign-in is on, and the portal has a data folder to keep the requests and the users in (FR-62).
        When it is on it lists the pages a person may ask for, those a guest can hold (not the Users page or the scorecard), and the longest name and reason it keeps.
      operationId: getAccountRequestInfo
      tags: [Meta]
      security: []
      responses:
        '200':
          description: Whether requests are accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRequestInfo' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: Leave a request for an account
      description: |
        Public, and the one public route that writes to disk, so it is held tight (FR-62). A 404 while the setting is off. It is checked like sign-in is: it needs `X-HCML-CSRF: 1` and an `Origin`
        of the portal's own, and a body over 8 KB is a 413. The body is a name, the pages wanted, chosen from the list `GET /api/auth/request` gives (at most 20), and a reason. The name is cut at
        80 characters and the reason at 500; control characters are dropped. What is wrong with a body is a 400 in words: a name under 2 characters, no page, a page that is not on the list, a reason
        under 3 characters, or a field the portal does not know. One address may leave `ACCOUNT_REQUESTS_PER_ADDRESS` requests a day (3 by default; 429 with `Retry-After`; the addresses of one IPv6 network, a /64, count as one, as they do for sign-in), at most
        `ACCOUNT_REQUESTS_MAX_PENDING` wait at once (50 by default; 503 `requests_full`), and a request nobody answers is dropped after 30 days. A request whose name is already waiting, whatever the case,
        is dropped, and the answer is the same 202 as for one that was kept, so the form says nothing about who is known. When the list is full it is the same 503 for a name that is waiting and for one that is not, for the same reason.
        The log gets the step and the name, never the reason.
      operationId: leaveAccountRequest
      tags: [Meta]
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRequestBody' }
      responses:
        '202':
          description: Kept, or a copy of one that was waiting. Nothing says which.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/CsrfRefused' }
        '404':
          description: '`not_found`, this portal does not accept requests for an account.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: '`rate_limited`, this address has left as many requests as it may for one day, or the 300 requests a minute of the client address. `Retry-After` says how long to wait.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/RequestsError' }
        '503':
          description: '`requests_full`, the list of requests is full; an administrator has to clear it.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/hosts:
    get:
      summary: Every host, disabled ones included, with its resolved site
      description: |
        Cached 30 s. `site` is resolved by `siteRefOf` in `sites.ts` from four ranked signals: tag, host name,
        inventory, group, because no HCML host carries a site tag. It is null when none of them names one of HCML's sites. The
        Sites page and the scorecard use the same rule, and so do `/api/hosts/overview`, `/api/devices` and `/api/net/devices`, so a host is under one site on every page (BK-94).
      operationId: getHosts
      tags: [Hosts]
      responses:
        '200':
          description: Hosts.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ZHost'
                    - type: object
                      properties:
                        site:
                          oneOf:
                            - $ref: '#/components/schemas/SiteRef'
                            - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/hosts/overview:
    get:
      summary: Hosts with reachability state and problem counts
      description: |
        Cached 15 s. `state` is the portal's own reachability judgement (`reachability.ts`), ping
        first, interface flags only as a fallback, on 17 Sep, 16 of 23 hosts Zabbix called
        unavailable answered ping. `reason` records which signal decided it. `site` is the same as on `/api/hosts`.
      operationId: getHostsOverview
      tags: [Hosts]
      responses:
        '200':
          description: Hosts with derived state.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ZHost'
                    - type: object
                      required: [state, reason, problems, site]
                      properties:
                        state: { $ref: '#/components/schemas/HostState' }
                        reason: { $ref: '#/components/schemas/StateReason' }
                        problems: { $ref: '#/components/schemas/ProblemCounts' }
                        site:
                          oneOf:
                            - $ref: '#/components/schemas/SiteRef'
                            - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/devices:
    get:
      summary: Every host as a device of one kind, for the Devices page
      description: |
        Cached 30 s. The same hosts, reachability and problem counts as `/api/hosts/overview`, which it
        reads through the same cache entry, each with the kind of device it is and the monitoring
        template that decided it. The kind is the one the derived SLA report uses (`naming.ts`
        `deviceClass`: the template first, then the name), so the two count a switch the same way. The
        templates are read once for five minutes. A host whose templates have not been read yet comes
        back with category `Other`. `classes` lists every kind in the order the page shows them, with
        its plural name.
      operationId: getDevices
      tags: [Hosts]
      responses:
        '200':
          description: The kinds, and the devices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/hostgroups:
    get:
      summary: Zabbix host groups
      description: Straight `hostgroup.get` passthrough. Cached 60 s. 23 groups in HCML's estate.
      operationId: getHostGroups
      tags: [Hosts]
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [groupid, name]
                  properties:
                    groupid: { type: string }
                    name: { type: string }
                  additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/items:
    get:
      summary: Items for a host, or by explicit ids
      description: |
        Cached 30 s. `hostid` is required unless `itemids` is given.

        `search` is a substring match on the item's key (`search: { key_ }`, with no `startSearch`), so it finds text in the middle of a key. A prefix match would be quicker for Zabbix,
        but the picker would stop finding mid-key text; the words here once said the prefix match was in use, and it never was.

        The items carry no `lastvalue` or `lastclock`. Zabbix looks each of them up on its own, from 30 ms to half a second an
        item on HCML's, which made a host of 609 items take 20 to 32 s, and the item picker never shows them. `/api/latest` has them.

        A request with a `search` of more than spaces counts against 120 searches a minute for each signed-in person (or each
        client address with sign-in off), since a search with new text is a cold read of Zabbix. `/api/latest` shares that count.
        The text is trimmed before it is used. Ids are digits, at most 20 of them, and not above 18446744073709551615.
      operationId: getItems
      tags: [Hosts]
      parameters:
        - name: hostid
          in: query
          description: Required unless `itemids` is supplied. Numeric.
          schema: { type: string, pattern: '^\d+$' }
        - name: itemids
          in: query
          description: Comma-separated numeric ids, de-duplicated. At most 50 or 400.
          schema: { type: string }
        - name: search
          in: query
          description: Substring match on `key_`.
          schema: { type: string }
        - name: graphable
          in: query
          description: Numeric items only. Truthy for exactly `1` or `true`; anything else is false.
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Item' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, the person made more than 120 searches in a minute, or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/latest:
    get:
      summary: Latest values, paged or capped
      description: |
        Cached 15 s. **The presence of `page` switches mode**, and the two modes differ in more than
        pagination: paged mode searches `name` OR `key_`, un-paged searches `name` only.

        With neither `hostid` nor `groupid` this returns an empty result with 200, not 400.

        A request with a `search` of more than spaces counts against 120 searches a minute for each person, shared with `/api/items`.
      operationId: getLatest
      tags: [Hosts]
      parameters:
        - name: hostid
          in: query
          schema: { type: string, pattern: '^\d+$' }
        - name: groupid
          in: query
          schema: { type: string, pattern: '^\d+$' }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          description: Presence switches to paged mode.
          schema: { type: integer, minimum: 1, maximum: 1000000 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 25, maximum: 500, default: 100 }
      responses:
        '200':
          description: |
            `total`, `page` and `pageSize` are present only in paged mode. `page` is the page returned: the last one
            when a later one was asked for. `truncated` means the cap was hit: 500 rows un-paged, 20,000 ids paged.
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LatestItem' } }
                  truncated: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, the person made more than 120 searches in a minute, or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/problems:
    get:
      summary: Open problems
      description: |
        Cached 15 s, and never served stale: an operator who has just acknowledged must not be
        shown the previous list. About 664 problems at HCML, 459 kB compressing to 25 kB.

        `opdata` is not in the list: Zabbix fills it from history one problem at a time, which took
        HCML's Zabbix 35 to 46 s for 650 problems against 0.9 s without it. Explain reads it for its
        one problem.

        The list also carries problems Zabbix resolved moments ago (`r_eventid` other than `0`),
        which the Problems page marks Resolved, and problems raised inside a planned maintenance
        window (`suppressed` = `1`), marked In maintenance. The Dashboard and every server-side
        count (`/api/stats`, sites, the hosts overview, maps, aging, the services tree, the
        Assistant's snapshot) leave both out, as Zabbix's own dashboard does.
      operationId: getProblems
      tags: [Problems]
      responses:
        '200':
          description: Open problems, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Problem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/stream:
    get:
      summary: Live problem stream (SSE)
      description: |
        `text/event-stream`. **Exempt from the rate limit, but capped:** at most `STREAM_MAX_CLIENTS`
        (default 100) screens in all and `STREAM_MAX_PER_USER` (default 5) for one signed-in user, or for
        one client address with auth off. A screen past either limit gets `429 too_many_streams` with
        `Retry-After: 30`, before any stream header. The browser's `EventSource` cannot read that body,
        so it falls back to polling and retries.

        One shared 15 s ticker serves every client, the pace the problem list is cached. A frame is sent at once when the fingerprint over
        `eventid:severity:acknowledged:suppressed:r_eventid` changes. A list identical to the last one
        sent is never sent again, and one where only a name or host changed goes after at most 30 s. A change in tags alone is not in the frame. A
        new client receives the current frame immediately, and an acknowledge force-pushes one.

        Three frame kinds:

        | Frame | Payload |
        |---|---|
        | `event: problems` | the problems of `GET /api/problems`, cut to the fields the Dashboard reads: `eventid`, `objectid`, `object`, `name`, `severity`, `clock`, `r_eventid`, `acknowledged`, `suppressed`, `host` and `hostid`. No tags, `opdata`, `r_clock`, `manualClose` or other field Zabbix returns (about half the size of the full list) |
        | `event: error` | `{ "message": string }` |
        | `event: ping` | after 15 s with nothing else sent, so a client can tell a quiet line from a dead one: `{ "ageMs": n }`, the age of the last good read of the list, when known, and `{}` otherwise |

        A client that sends `Accept-Encoding: gzip` (every browser does) gets the stream gzip-compressed,
        flushed after every frame and keep-alive, with `Content-Encoding: gzip` and `Vary: Accept-Encoding`;
        on HCML's list the first frame goes from 166 kB to 19 kB.

        The stream ends, and the browser reconnects with the renewed cookie or is sent to sign in, when: the session token it was opened with expires, or the person's account does, whichever is
        first (SC-57); the person signs out; an administrator changes the person (disables them, sets an expiry, changes the role or the pages, resets the password or asks for a new one) or the
        person changes their own password, so that the screen comes back as the account allows now (SC-57); and when the BFF shuts down on `SIGTERM`.

        No `id:` field is emitted, so `Last-Event-ID` resumption is not supported. Browsers cannot
        set headers on `EventSource`, but it sends the session cookie on a same-origin request like
        any other, so the stream authenticates by cookie. A `?token=` is refused with 401 here as on
        every route.
      operationId: streamProblems
      tags: [Problems]
      responses:
        '200':
          description: The stream opens and stays open until its token or the account expires, or the account changes.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: '`too_many_streams`, the portal or this account is at its screen limit.'
          headers:
            Retry-After:
              description: Always `30`.
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/graph:
    get:
      summary: Downsampled series for up to four items
      description: |
        Cached 15 s live, 600 s historical. **Three mutually exclusive range modes, in precedence
        order: `month`, then `from`+`to`, then `hours`.**

        Below 24 hours it reads raw history; above, hourly trends; and `source` in the response says
        which was used. Everything is bucketed to at most `points` per series, so a 30-day graph is a
        few tens of kB rather than 500. An explicit `null` point is inserted wherever the gap between
        samples exceeds 3× the expected spacing, so the chart breaks the line instead of drawing
        across a collection gap.
      operationId: getGraph
      tags: [History]
      parameters:
        - name: itemids
          in: query
          required: true
          description: Comma-separated. At most 4 or 400.
          schema: { type: string }
        - name: month
          in: query
          description: Highest precedence. A future month is 400.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: from
          in: query
          description: Unix seconds. Must be paired with `to`. Range may not exceed 400 days, as asked.
          schema: { type: integer }
        - name: to
          in: query
          description: Unix seconds. The range is widened to whole minutes (`from` down, `to` up), and the response says the range it used, so requests seconds apart share one cached read.
          schema: { type: integer }
        - name: hours
          in: query
          description: Used only when neither `month` nor `from`/`to` is given.
          schema: { type: integer, minimum: 1, maximum: 8760, default: 24 }
        - name: points
          in: query
          description: Target samples per series after bucketing.
          schema: { type: integer, minimum: 200, maximum: 3000, default: 1500 }
      responses:
        '200':
          description: One series per item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphResponse' }
        '400':
          description: |
            Bad range, more than 4 items, unknown itemids, or a non-numeric item.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`forbidden`, an account without the Network page asked for a network interface item (key starting `net.if`). Accounts that have the Network page, and administrators, may read them.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/net/devices:
    get:
      summary: Network devices with ICMP state
      description: '**Network page.** Cached 30 s. Narrowed to `NET_GROUP_IDS` when that is configured.'
      operationId: getNetDevices
      tags: [Network]
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/NetDevice' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/net/meters:
    get:
      summary: Internet traffic meters, read from the gauge widgets of a Zabbix dashboard
      description: |
        **Network page.** Cached 30 s. The dashboard itself is kept for two minutes.

        Reads the dashboard named by `INTERNET_METERS_DASHBOARD` (default `Global view`, HCML's own) with
        `dashboard.get` and makes one meter of each gauge widget: the interface item it is bound to, the
        capacity it was given as its maximum, and its colour zones. The meters come in the order a person
        reads the pages, and a later page that repeats an item adds nothing. Nothing is created or changed
        in Zabbix.

        The value is the item's last value. Zabbix keeps that only for a day, so an item with none (silent
        for longer, or collected by a copy of Zabbix that has stopped) is read from history, one newest
        row each, and comes back as `stale` with its own time. A reading counts as current for three
        update intervals, and at least ten minutes. When no dashboard of that name is visible to the
        Zabbix token, `found` is false and `meters` is empty.

        Two more things are read for each gauge, from the items beside its own on the same host and the same
        interface (the same ifIndex): the interface's status item, and the item of the opposite direction.
        They are searched for once in two minutes (`item.get` by key prefix) and their values asked for with
        the gauge's own. Only a current value counts, and none is ever read from history: a status or a
        traffic figure from days ago says nothing about the link today. `link` says whether the interface is
        up or down, and `other` is the opposite direction on the gauge's own scale and zones, which assumes a
        link that is the same size both ways.
      operationId: getNetMeters
      tags: [Network]
      responses:
        '200':
          description: The meters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/net/interfaces:
    get:
      summary: Interfaces for one device, searched then filtered then paged
      description: |
        **Network page.** Cached 15 s.

        Order matters and is observable: `search` is applied first, `summary` is computed over the
        searched set, *then* `status` filters, *then* the page is sliced. So `summary` counts more
        rows than `rows` contains whenever `status` is set.

        **`status` fails silently.** Any value outside the enum is treated as no filter rather than
        rejected with 400.

        **A page past the last is the last page.** `page` in the answer says which page the rows are, so an old
        address, or a list that shrank, never reads as empty.
      operationId: getNetInterfaces
      tags: [Network]
      parameters:
        - name: hostid
          in: query
          required: true
          schema: { type: string, pattern: '^\d+$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 10, maximum: 1000, default: 200 }
        - name: search
          in: query
          description: Case-insensitive substring of `name` or `alias`.
          schema: { type: string }
        - name: status
          in: query
          description: An unrecognised value is ignored, not rejected.
          schema: { type: string, enum: [up, down, other] }
      responses:
        '200':
          description: One page of interfaces.
          content:
            application/json:
              schema:
                type: object
                required: [rows, total, summary, page, pageSize]
                properties:
                  rows: { type: array, items: { $ref: '#/components/schemas/InterfaceRow' } }
                  total: { type: integer }
                  summary:
                    type: object
                    required: [up, down, other]
                    properties:
                      up: { type: integer }
                      down: { type: integer }
                      other: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/top-hosts:
    get:
      summary: The busiest hosts right now, by CPU and by memory
      description: |
        Cached 30 s. For each of CPU and memory, the hosts with the highest current utilisation, as the
        Zabbix dashboard widget "Top hosts" lists them. The items are found by key prefix and by the same rules
        as the capacity report (`system.cpu.util`, `vm.memory.util`, the SNMP forms of Cisco and FortiGate), so
        the idle share is never taken. A host with several matching items counts once, by its hottest.

        Only a current value is listed: an item whose last value is older than three of its intervals (and at
        least ten minutes) is counted in `considered` and not in `current`, and is never read from history, so
        a copy of Zabbix that has stopped gives `current: 0` and no rows.
      operationId: getTopHosts
      tags: [Reports]
      parameters:
        - name: limit
          in: query
          description: Rows for each metric.
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: The busiest hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopHostsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/web-monitoring:
    get:
      summary: Web scenarios that pass, fail or have no current result
      description: |
        Cached 30 s. Every enabled web scenario of a monitored host is counted once, as the Zabbix dashboard widget
        "Web monitoring" counts them, from the item that holds its result (`web.test.fail[<scenario>]`: 0 when every
        step passed, otherwise the step that failed).

        Only a current result is believed: one older than three of the item's intervals (and at least ten minutes),
        an item Zabbix cannot collect and an item that has collected nothing are `unknown`, so a scenario nobody has
        run lately is never read as OK. The failed ones are listed by host and then by name, as many as `limit` says,
        and `failed` counts them all.
      operationId: getWebMonitoring
      tags: [Reports]
      parameters:
        - name: limit
          in: query
          description: Failed scenarios to list.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: The counts and the failed scenarios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebMonitoringResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/top-triggers:
    get:
      summary: The triggers that fired most often
      description: |
        Cached 60 s. Reads at most 10,000 events and returns the top 100; `truncated` says the cap
        was hit, which it will be for large `days`.
      operationId: getTopTriggers
      tags: [Reports]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
      responses:
        '200':
          description: Ranked triggers.
          content:
            application/json:
              schema:
                type: object
                required: [triggers, truncated, days]
                properties:
                  triggers:
                    type: array
                    items:
                      type: object
                      required: [objectid, name, severity, host, count]
                      properties:
                        objectid: { type: string }
                        name: { type: string }
                        severity: { type: string }
                        host: { type: string }
                        count: { type: integer }
                  truncated: { type: boolean }
                  days: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person already has four reports being prepared (a report over days of history waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/stats:
    get:
      summary: Estate counts for the dashboard tiles
      description: |
        Cached 30 s. Four count-only Zabbix calls in parallel plus the shared problem list. `hosts`
        counts enabled (monitored) hosts only, as the Dashboard's card says, and `items` counts
        monitored items. Counting items took HCML's Zabbix about 40 s and the monitored triggers 74 s,
        so those two counts are kept for an hour and read again in the background; each is null until
        its first count arrives.
      operationId: getStats
      tags: [Reports]
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [hosts, items, triggers, groups, problems, unacknowledged, bySeverity]
                properties:
                  hosts: { type: integer }
                  items: { type: [integer, 'null'] }
                  triggers: { type: [integer, 'null'] }
                  groups: { type: integer }
                  problems: { type: integer }
                  unacknowledged: { type: integer }
                  bySeverity: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/freshness:
    get:
      summary: When Zabbix last collected a value
      description: |
        Whether Zabbix is still collecting, for the Dashboard. A stopped `zabbix-server` leaves every
        API call working and every value in place, so the newest value of any supported ICMP item
        is the only sign. It is rolled up from the reads the host states make, the ping items once an
        hour and their values of the last 15 minutes in one `history.get` per value type, so asking for
        both costs Zabbix nothing more. With no value in those 15 minutes, Zabbix's own last value of a
        few items says how long ago it stopped.

        The newest clock is cached 30 s; `ageSeconds` is worked out at each request. `stale` is true
        once nothing has been collected for `staleAfterSeconds`, ten minutes (the floor `isFresh` allows
        before it stops believing a ping), and is never true while the age is unknown, which happens
        when no ICMP item exists. A Zabbix failure is an error, not an invented age.
      operationId: getFreshness
      tags: [Reports]
      responses:
        '200':
          description: The data clock.
          content:
            application/json:
              schema:
                type: object
                required: [lastCollectedAt, ageSeconds, stale, staleAfterSeconds, pinged, answering, reachLost]
                properties:
                  lastCollectedAt:
                    type: [integer, 'null']
                    description: When Zabbix last collected a value, Unix seconds. Null when there is no ICMP item to tell.
                  ageSeconds: { type: [integer, 'null'], minimum: 0 }
                  stale: { type: boolean }
                  staleAfterSeconds: { type: integer, const: 600 }
                  pinged: { type: integer, minimum: 0, description: Hosts whose latest ping is fresh. }
                  answering: { type: integer, minimum: 0, description: How many of those answered it. }
                  reachLost:
                    type: boolean
                    description: |
                      At least 10 hosts were pinged and at most a fifth of them answered, so Zabbix has more
                      likely lost its way into the network than every device its power.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/problems-by-group:
    get:
      summary: Open problems per host group
      description: Cached 15 s. Groups with no problems are omitted; the rest are sorted descending.
      operationId: getProblemsByGroup
      tags: [Reports]
      responses:
        '200':
          description: Groups carrying at least one problem.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [groupid, name, total, bySeverity]
                  properties:
                    groupid: { type: string }
                    name: { type: string }
                    total: { type: integer }
                    bySeverity: { type: object, additionalProperties: { type: integer } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/availability:
    get:
      summary: Per-host availability over a window
      description: |
        A window, and `basis=all-problems` with a month, are cached 120 s with `staleIfError`: an upstream
        failure returns 200 with an old copy, marked by `X-Data-Stale` and `X-Data-Age-Seconds`, and a copy
        past its time is answered with `X-Data-Refreshing` while a new one is read (see Stale answers above).
        A month with the default basis is the derived monthly SLA of `/api/sli`: it is kept and refreshed as
        that is, and carries `X-Data-Stale` only when Zabbix fails, never `X-Data-Refreshing`.

        **Two bases with materially different responses.** With `basis=availability` (the default)
        the derived SLI engine runs and `overall`, `categories`, `sites`, `target`, `profile` and
        `gaps` are all present. With `basis=all-problems` none of them are, and each host carries
        only its id, name, availability, downtime, incidents and longest outage. The pages of the portal
        ask for `basis=availability` only; `basis=all-problems` stays for callers that still use it.

        `month` takes precedence over `days`. A month that has not started is 400, and so is one
        more than 400 days ago, Zabbix keeps events about a year.

        `basis=all-problems` counts a problem that began before the window and was still open when it
        started from the window's first second, as the SLA engine does. Problems still open now are found
        at any age, and so is one that began more than 31 days before the window and ended inside it: it is
        found from its recovery event (BK-04). One that began more than 31 days before the window and
        ended after it is missed. At most 200 such older outages are looked up one by one; past that,
        `truncated` is true and the figures are a floor.
      operationId: getAvailabilityReport
      tags: [Reports]
      parameters:
        - name: basis
          in: query
          schema: { type: string, enum: [availability, all-problems], default: availability }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
        - name: severity
          in: query
          description: Minimum severity. With `basis=all-problems` it decides which problems count; with `basis=availability` it changes no figure and only comes back as `minSeverity`. Defaults to `AVAILABILITY_MIN_SEVERITY`, normally 2.
          schema: { type: integer, minimum: 0, maximum: 5 }
        - name: month
          in: query
          description: Takes precedence over `days`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: profile
          in: query
          description: Ignored when `basis=all-problems`.
          schema: { type: string, enum: [availability, hcml-report] }
      responses:
        '200':
          description: Availability report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person already has four reports being prepared (a report over days of history waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/noise:
    get:
      summary: Flapping, chronic and unactioned triggers
      description: |
        Cached 120 s with `staleIfError`. Note `severity` defaults to 0 here, not 2 as on the
        availability report. `top` cuts the returned list only: every aggregate above it covers all
        triggers, and `total` says how many there were.

        A problem that began before the window and was still open when it started is counted from the
        window's first second, with its real start kept for its age, so a problem open for weeks can be
        flagged chronic. The lookback is the same as for the availability report: still-open problems at
        any age, resolved ones within 31 days before the window, and older ones that ended inside the window,
        found from their recovery event (BK-04). `truncated` is true when more than 200 of those older outages
        needed a lookup: the rest are left out and the figures are a floor.
      operationId: getNoiseReport
      tags: [Reports]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
        - name: severity
          in: query
          schema: { type: integer, minimum: 0, maximum: 5, default: 0 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Noise report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoiseReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person already has four reports being prepared (a report over days of history waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/aging:
    get:
      summary: How long unacknowledged problems have been open
      description: |
        Cached 15 s. `buckets` is always exactly four, labelled `Under 1h`, `1–4h`, `4–24h`,
        `Over 24h`.
      operationId: getAgingReport
      tags: [Reports]
      responses:
        '200':
          description: Aging buckets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/capacity:
    get:
      summary: Average and peak utilisation per item
      description: |
        Rebuilt about hourly: cached an hour, then the last report is answered with
        `X-Data-Refreshing` for up to a day while the next one is built, and with `X-Data-Stale` when
        a rebuild fails (`staleIfError`). The ports' link speeds are kept a day. **The heaviest
        endpoint in the portal**: one run took HCML's Zabbix 256 s on 29 October 2026. At `days=365` it
        issues roughly 112 Zabbix calls, because `trend.get` is sliced to keep Zabbix's PHP within
        its memory limit, and each call costs about 20 SQL statements upstream, 10,771 in total,
        measured 22 Sep.

        `avg` is the unweighted mean of the hourly averages, not a sample-weighted mean.

        The busiest interfaces are those of the moment the report was built: the 40 with the highest last rate against the port's speed (four times `top` when that is more) are chosen then, and only those are read for the
        `days` asked for and ranked by their average over them. A link that was quiet at that moment, and busy before it, is not in the list. `generatedAt` says when (BK-92).
      operationId: getCapacityReport
      tags: [Reports]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
        - name: top
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: One group per metric.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person already has four reports being prepared (a report over days of history waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/reports/inventory:
    get:
      summary: Naming, site, owner and criticality completeness
      description: |
        **admin.** Cached 60 s, and the cheapest heavy report: exactly
        one Zabbix call, everything else computed in process.

        `dimensions` always has four entries in the order `naming`, `site`, `owner`, `criticality`.
        `scored: false` means the deployment has not configured that check.
      operationId: getInventoryScorecard
      tags: [Reports]
      responses:
        '200':
          description: Scorecard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScorecardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/links:
    get:
      summary: WAN links and paths, from ICMP item triplets
      description: |
        **Links page.** Cached 20 s.

        A "link" is not a Zabbix entity. It is synthesised from the `icmpping`, `icmppingloss` and
        `icmppingsec` items on a host, paired into a path by the `link_group` item tag. `jitter` is
        max minus min RTT and appears only where min/max-mode items exist. The portal never speaks
        ICMP itself, Zabbix polls, this reads the items.
      operationId: getLinks
      tags: [Network]
      responses:
        '200':
          description: Links, paths and thresholds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinksResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/sites:
    get:
      summary: Hosts grouped into sites
      description: |
        Cached 15 s. Zabbix has no site entity. `resolveSite` (`services/sites.ts`) resolves one from four ranked
        signals, tag, host name, inventory, group, and `coverage` reports how many hosts each
        signal accounted for, which is the metric for the standardisation goal.
      operationId: getSites
      tags: [Sites]
      responses:
        '200':
          description: Sites with their hosts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/services:
    get:
      summary: Zabbix-native service tree
      description: |
        Cached 30 s. Recursive, depth-capped at 12. A shared
        dependency legitimately appears under two parents (it is a DAG, not a tree), so it is built under each of them, and `descendants` counts each distinct `serviceid` once. A service below several parents is built under each of them, so the tree stops at 5,000 nodes and says so
        with `truncated: true` (BK-96).

        **At HCML this returns an empty tree**: the `services` table has zero rows. Use
        `/api/sla/source` to decide whether to render this or the derived equivalent.
      operationId: getServices
      tags: [Services]
      responses:
        '200':
          description: Service tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/services/derived:
    get:
      summary: The portal's own service tree
      description: |
        Cached 30 s. Deliberately emits the same shape as `/api/services` plus extra fields, so one
        component renders either. Builds root → business services → sites → device class → hosts,
        each node carrying the derived monthly SLA for its subtree. The monthly report under it can be
        an old copy when Zabbix fails, in which case the answer carries `X-Data-Stale`.
      operationId: getDerivedServices
      tags: [Services]
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: profile
          in: query
          schema: { type: string, enum: [availability, hcml-report] }
      responses:
        '200':
          description: Derived tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DerivedServicesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person has too many monthly SLA reads being prepared (a month that is not kept yet waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/sla/source:
    get:
      summary: Whether Zabbix's own SLA has anything in it
      description: |
        Cached 60 s. `real: false` tells the UI to switch to the derived SLA. **At HCML it is always
        false**: one placeholder SLA object, no services, nothing attached.
      operationId: getSlaSource
      tags: [SLA]
      responses:
        '200':
          description: Source decision.
          content:
            application/json:
              schema:
                type: object
                required: [real, slas, services]
                properties:
                  real: { type: boolean }
                  slas: { type: integer }
                  services: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/sla:
    get:
      summary: Zabbix SLA definitions
      description: Cached 60 s.
      operationId: getSlas
      tags: [SLA]
      responses:
        '200':
          description: SLA objects.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ZbxSla' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/sla/sli:
    get:
      summary: Zabbix-computed SLI per service
      description: |
        Cached 60 s.

        Both ids are checked before the cache key is built, so a junk value is a 400 and never a Zabbix
        error. **Inconsistency:** omitting `slaid` still returns `[]` with 200, whereas
        `/api/explain/sla` rejects the same omission with 400.
      operationId: getSlaSli
      tags: [SLA]
      parameters:
        - name: slaid
          in: query
          description: A numeric id. Missing gives an empty array and 200.
          schema: { type: string, pattern: '^\d+$' }
        - name: serviceid
          in: query
          schema: { type: string, pattern: '^\d+$' }
      responses:
        '200':
          description: One entry per service.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SlaSli' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/sli:
    get:
      summary: The portal's derived monthly SLA
      description: |
        Cached 24 h for a closed month, 5 min for the current one, both with `staleIfError`: when
        Zabbix fails the old report is served with `X-Data-Stale: true` and `X-Data-Age-Seconds`. The
        cache key carries the closed flag, so a figure computed mid-month is never kept as that
        month's final answer, and a closed month is pinned, so a flood of graph keys cannot push it out
        of the cache.

        Two profiles. `hcml-report` reproduces HCML's own published Availability Report and is
        validated against it to the digit, 99.3796 % for June 2026, 99.7167 % July, 99.2313 %
        August, 138 of 138 hosts within 60 seconds. `availability` is the stricter figure, and costs
        roughly 20 Zabbix calls against the report profile's 6 because it also checks per-hour
        collection coverage from trends.
      operationId: getSli
      tags: [SLA]
      parameters:
        - name: month
          in: query
          description: Defaults to the current month in `Asia/Jakarta`. Not with `from` and `to`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: profile
          in: query
          schema: { type: string, enum: [availability, hcml-report] }
        - name: from
          in: query
          description: |
            The start of a window that is not a calendar month, in Unix seconds, on the hour in the report's time zone. Goes with `to`. The month
            it starts in must have begun no more than 400 days ago, since Zabbix keeps events for about a year, and the window may be at most 366 days.
          schema: { type: string, pattern: '^\d{1,12}$' }
        - name: to
          in: query
          description: The end of the window, in Unix seconds, on the hour. A window that ends in the future is measured up to now.
          schema: { type: string, pattern: '^\d{1,12}$' }
        - name: dayHours
          in: query
          description: |
            Count only these hours of the day, as `start-end` in whole hours: `8-17` is 08:00 to 17:00, `22-6` runs from 22:00 through midnight to 06:00 of the next day,
            and a span belongs to the day it starts. With `month` or with `from` and `to`.
          schema: { type: string, pattern: '^\d{1,2}-\d{1,2}$' }
        - name: days
          in: query
          description: Count only spans that begin on these days of the week, Monday 1 to Sunday 7, separated by commas. All days when left out.
          schema: { type: string, pattern: '^[1-7](,[1-7])*$' }
      responses:
        '200':
          description: |
            The report. For a calendar month with no `dayHours` or `days` it is the monthly report, with its web checks. For any other window it has no web checks
            (`web` is empty), since those need the raw readings of the last 31 days and are kept monthly, and `month` is null unless the window was given as a month.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SliReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person has too many monthly SLA reads being prepared (a month that is not kept yet waits for one of two places in a line, and one person may hold four of the places), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/SliUnavailable' }

  /api/users:
    get:
      summary: The users, the modules, and whether they can be changed
      description: |
        **admin.** The users that can sign in (the break-glass account first, then by name), the modules a user can be given, the modules a new user of each role starts with,
        and whether the users are kept across a restart (`durable`) and may be changed here (`editable`). Without a data folder the users are those of `.env` and neither is true. `secure` says that this
        request came over HTTPS: real accounts wait for it. With sign-in off (`AUTH_ENABLED=false`) all of the Users routes answer 503 `sign_in_off`, since nobody could be told from an administrator (SC-59).
        The requests waiting for an account are read from `GET /api/users/requests`.
      operationId: listUsers
      tags: [Users]
      responses:
        '200':
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [users, modules, presets, durable, editable, failing, secure]
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/UserRecord' } }
                  modules: { type: array, items: { $ref: '#/components/schemas/ModuleInfo' } }
                  presets:
                    type: object
                    description: "The modules a new user of each role starts with. Only a start: what is stored is the user's own list."
                    required: [guest, operator, admin]
                    properties:
                      guest: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
                      operator: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
                      admin: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
                  durable: { type: boolean }
                  editable: { type: boolean }
                  failing: { type: boolean, description: 'A save failed and has not worked since.' }
                  secure: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SignInOff' }
    post:
      summary: Add a user
      description: |
        **admin.** The name is 3 to 64 letters, digits and `. _ @ -`, beginning and ending with a letter or digit, and unique whatever the case. The role is `guest`, `operator` or `admin`; the modules
        are those of the role's preset when left out, and an administrator always has every one. The password is at least 8 and at most 256 characters, not on the lists of passwords that anyone can guess (the common ones, one of their base words with digits or signs after it, or one character repeated), and not holding `hcml` or the sign-in name, and the user must
        change it at the first sign-in unless `mustChange` is false. 409 when the name is taken, when there is no data folder to keep users in, or when the portal holds the most it can (200).
        A field the portal does not know is a 400 that names it; it is not dropped, so a mistyped field cannot pass as a change that did nothing (BK-97). The log gets one line, never the password.
      operationId: createUser
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/UsersError' }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/users/{name}:
    patch:
      summary: Change a user
      description: |
        **admin.** Any of the name shown, the role, the modules, the language, the expiry, `disabled` and `mustChange`; at least one. A user is never deleted, only disabled. A new role keeps the modules the user
        may still have. 409 for a user kept in `.env`, for a change that would leave no administrator who can sign in, and for an administrator who disables, demotes or expires their own account. Takes effect on the user's next request, and the person's open live streams end so that they come back as the account allows now (SC-57).
        A field the portal does not know is a 400 that names it; it is not dropped, so a mistyped field cannot pass as a change that did nothing (BK-97).
      operationId: updateUser
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/UsersError' }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/users/{name}/password:
    post:
      summary: Set a user's password
      description: |
        **admin.** A reset. The user must change it at the next sign-in unless `mustChange` is false, and every session of theirs begun before now ends, and so do their open live streams. The password is held to the same rule as a new user's: at least 8 and at most 256 characters, not on the lists of passwords that anyone can guess (the common ones, one of their base words with digits or signs after it, or one character repeated), and not holding `hcml` or the sign-in name. A field the portal does not know is a 400 that names it; it is not dropped, so a mistyped field cannot pass as a change that did nothing (BK-97).
      operationId: resetUserPassword
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                mustChange: { type: boolean }
      responses:
        '200':
          description: Set.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/UsersError' }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/users/requests:
    get:
      summary: The requests for an account that are waiting
      description: |
        **admin.** The requests left on the sign-in page (FR-62), the oldest first. `enabled` is whether the portal accepts them now, `max` how many may wait at once
        (`ACCOUNT_REQUESTS_MAX_PENDING`). A request nobody answers is dropped after 30 days. With sign-in off this answers 503 `sign_in_off`, as the other Users routes do.
      operationId: listAccountRequests
      tags: [Users]
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRequestList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/users/requests/{id}/approve:
    post:
      summary: Approve a request by making the account
      description: |
        **admin.** The body is the one of `POST /api/users`: the administrator types the name (it need not be the one asked for), the role, the pages and a temporary password, and the account is made
        exactly as the Users page makes any. The request is taken off the list first, in one step, so that of two administrators who answer it at once only one gets it and the other has 404; when the account cannot be made (the name is taken, there is no data folder, the password is not accepted)
        it is put back where it was. 404 when the request is gone, for example answered by another administrator. A field the portal does not know is a 400 that names it; it is not dropped, so a mistyped field cannot pass as a change that did nothing (BK-97). The log gets the step and the names, never a password.
      operationId: approveAccountRequest
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: The account is made and the request is off the list.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/UserRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: '`users_error` (the file of users could not be saved) or `requests_error` (the file of requests could not be saved): see `UsersError` and `RequestsError`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/users/requests/{id}/refuse:
    post:
      summary: Refuse a request
      description: |
        **admin.** Takes the request off the list and makes no account. It takes no body: none, or a JSON object that is ignored. 404 when the request is gone.
      operationId: refuseAccountRequest
      tags: [Users]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        description: Ignored. Nothing, or a JSON object.
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Refused.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/RequestsError' }
        '503': { $ref: '#/components/responses/SignInOff' }

  /api/sli/export:
    get:
      summary: The SLA report for a month, or for a range of days, as a PDF, Excel or CSV download
      description: |
        **guest.** The figures `/api/sli` shows for one month, or for a window of whole hours and the hours of the day that count (`from`, `to`, `dayHours`,
        `days`, read as `/api/sli` reads them), both methods side by side, as one file. `format=pdf` is the printable report; `format=xlsx` is the workbook, a Summary sheet and
        one sheet per table; `format=csv` is one zip holding a CSV file for the first page and for each
        table, and a notes file that explains them. The file states when it was generated and, for the
        current month, that its figures are not final.

        A file for a window is the same file with the period in place of the month. It has one figure for the whole window, not one for each month it touches, and
        its first page, its period line and its notes say which hours of the day were counted. Its Web checks table is there and empty, with the reason, since web checks are
        measured by calendar month: choose a month for them. A month with `dayHours` or `days` is a file of that kind too, and is named apart from the plain month's.

        `decimal`, `date` and `separator` choose how numbers and dates are written, and never what they say:
        a figure, a verdict and the order of the rows are the same in every style. `decimal` is the mark in a
        percentage (`dot` or `comma`), `date` is the shape of the dates in the report's text (`long` as in
        `4 Nov 2026`, `numeric` as in `04/11/2026`, `iso` as in `2026-11-04`), and `separator` is what a CSV file
        puts between its fields (`comma` or `semicolon`; the PDF and the workbook have none and ignore it).
        All three are optional and default to `dot`, `long` and `comma`; anything else, or a value given twice, is a 400.

        It reads the same cached reports as `/api/sli`, so a month the page has already loaded costs
        no further Zabbix call, and it inherits that route's `staleIfError`: while Zabbix is failing it
        can answer 200 with a file built from older figures, not 502, and says so with
        `X-Data-Stale` and `X-Data-Age-Seconds`. Nothing is kept for long: a
        built file is reused for ten seconds, then built again from the cached figures.

        `format`, the style, the window and the hours are checked before Zabbix is asked, so a bad request costs nothing. `month`, `from`, `to`, `dayHours`, `days`,
        `format`, `decimal`, `date` and `separator` are the only parameters: any other is a 400, so a misspelt
        `month` is never read as the current month. A month and a window together are a 400. `month` is
        validated as on `/api/sli`, and a month that has not started, or is more than about 400 days
        back, is a 400, as is a window that begins in such a month or that has no hour inside the daily hours chosen. The file name is made from the validated month, or from the dates and hours of the
        report itself, never from other request text: `HCML_SLA_Report_<month>.pdf`, `.xlsx` or `_csv.zip` for a month,
        `HCML_SLA_Report_<first day>_to_<last day>` for a window, and `_0800-1700` and `_d12345` after it when hours of the day were chosen.

        The body is not JSON, so it is never compressed whatever `Accept-Encoding` says, and
        `Cache-Control: private, no-store` keeps a shared cache from holding on to it.
      operationId: exportSli
      tags: [SLA]
      parameters:
        - name: month
          in: query
          description: Defaults to the current month in `Asia/Jakarta`. An empty value means the default. Not with `from` and `to`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: from
          in: query
          description: The start of a window that is not a calendar month, in Unix seconds, on the hour in the report's time zone. Goes with `to`, as on `/api/sli`.
          schema: { type: string, pattern: '^\d{1,12}$' }
        - name: to
          in: query
          description: The end of the window, in Unix seconds, on the hour. A window that ends in the future is measured up to now, and its file says the figures are not final.
          schema: { type: string, pattern: '^\d{1,12}$' }
        - name: dayHours
          in: query
          description: Count only these hours of the day, as `start-end` in whole hours, as on `/api/sli`. With `month` or with `from` and `to`.
          schema: { type: string, pattern: '^\d{1,2}-\d{1,2}$' }
        - name: days
          in: query
          description: Count only spans that begin on these days of the week, Monday 1 to Sunday 7, separated by commas. All days when left out.
          schema: { type: string, pattern: '^[1-7](,[1-7])*$' }
        - name: format
          in: query
          required: true
          description: Exactly `pdf`, `xlsx` or `csv`, in lower case. Missing, anything else, or given twice is a 400.
          schema: { type: string, enum: [pdf, xlsx, csv] }
        - name: decimal
          in: query
          description: The mark in a percentage. Defaults to `dot`.
          schema: { type: string, enum: [dot, comma] }
        - name: date
          in: query
          description: The shape of the dates in the report's text. Defaults to `long`.
          schema: { type: string, enum: [long, numeric, iso] }
        - name: separator
          in: query
          description: What a CSV file puts between its fields. Defaults to `comma`. Ignored for a PDF or a workbook.
          schema: { type: string, enum: [comma, semicolon] }
      responses:
        '200':
          description: The report, as an attachment.
          headers:
            Content-Disposition:
              description: |
                `attachment; filename="HCML_SLA_Report_2026-08.pdf"; filename*=UTF-8''HCML_SLA_Report_2026-08.pdf`.
                Only letters, digits, underscore, hyphen and the dot of the extension can appear in it. The CSV zip is
                `HCML_SLA_Report_2026-08_csv.zip`.
              schema: { type: string }
            Content-Length:
              description: The size of the file in bytes.
              schema: { type: integer }
            Cache-Control:
              description: Always `private, no-store`.
              schema: { type: string, const: 'private, no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            `rate_limited`, this person has too many monthly SLA reads being prepared (a month that is not kept yet waits for one of two places in a line, one person may hold four of the places, and a file takes two of them because it reads both methods), or the 300 requests a minute of the client address. `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499': { $ref: '#/components/responses/Cancelled' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/SliUnavailable' }

  /api/sli/email:
    get:
      summary: Whether the SLA report can be emailed, from where, to whom by default, and how far a list may go
      description: |
        **admin.** Lets the screen offer the "Email report" button only where it works, and say who a report goes to unless
        the person names others. It answers `enabled: false`, with no address, until the `MAIL_` settings are present and usable.
        `recipients` is the list the portal has saved; until it has saved one, it is the list in `MAIL_TO`, which may be empty.
        `max` is the most addresses a list may hold, `allowedDomains` the only domains an address may be in (empty: any), and
        `kept` whether the saved list survives a restart of the portal (it does when `PORTAL_STATE_DIR` names a folder that outlives the container).
        The saved list is changed with `PUT` and `DELETE /api/sli/recipients`. While sign-in is off, email is off too (`enabled: false`) unless `ALLOW_EMAIL_WITHOUT_AUTH=true`, and `PUT` and `DELETE /api/sli/recipients` answer 503 then, with or without mail settings.
      operationId: getSliEmail
      tags: [SLA]
      responses:
        '200':
          description: Whether email is on.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, from, recipients, max, allowedDomains, kept]
                properties:
                  enabled: { type: boolean }
                  from: { type: string, description: 'The sender address, or an empty string while email is off.' }
                  recipients: { type: array, items: { type: string }, description: 'The saved recipients, or an empty list while email is off.' }
                  max: { type: integer, description: The most addresses a list may hold. }
                  allowedDomains: { type: array, items: { type: string }, description: 'Lower case. Empty: an address may be in any domain.' }
                  kept: { type: boolean, description: Whether the saved list survives a restart of the portal. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Email the SLA report for a month, or for a range of days
      description: |
        **admin.** Builds the files `/api/sli/export` gives for the month, or for the `window` and the hours of the day, one to three formats, and sends them as attachments
        to one message, with the four figures of the report's first page in its text, through the SMTP server the `MAIL_`
        settings name. `to` is who it goes to: one to ten plain addresses, each in `allowedDomains` when that list is not empty.
        Left out, the saved list is used (`GET`), and with `remember: true` the list that was given is saved once the report has gone.
        `style` is written as `/api/sli/export` writes it. Any other field, in the body, in `window` or in `style`, is a 400: there is no subject
        and no message to set, and no copy or blind copy.

        The body names a `month`, or a `window` with `from` and `to` in Unix seconds (inside an object, since `to` is the list of people), and with either one
        `dayHours` and `days` as on `/api/sli`. Neither, or both, is a 400. A range waits ten minutes after its end, as a month does. Only a plain month is entered in the portal's short
        record of sends, which is the monthly schedule's book and is kept by month; a range, or a month in the hours of the day, is in the log alone. The schedule itself stays monthly.

        Checked in this order: the shape of the body (400), whether email is set up (503 `mail_disabled`), the month, the formats, the
        style and the recipients (400, each with a sentence that says what is wrong; a month or a window that has not started, that begins more than about 400 days back, that has no hour inside the daily hours chosen or that ended less than ten minutes ago, is one of them), the allowance of 5 sends an hour for each person
        (429 with `Retry-After`; only a request that gets this far is counted), the mail login (502 `mail_error`, before Zabbix is
        asked, so a wrong password fails in a second), and then the two reports are read and the message is sent. A month in which neither method
        finds a device is not sent (502 `empty_report`). A month that is
        not cached can take as long as the download does.

        Every send and every failure is logged with the user, the month (or the window's two times and the hours), the formats, the size, the number of recipients and the
        domains they are in, and never the addresses, the subject or a file; the portal also keeps a short record of it (counts only). A send that the mail server took for only some of the addresses is logged at warning level.
        A failure at the mail server is one fixed sentence for its kind (`login`, `connect`, `timeout`, `tls`, `recipients`,
        `rejected`, `other`); what the server said goes to the log only. The sentence for `timeout` says that the report may or may not have gone,
        because the server may have had the whole message when it stopped answering.
      operationId: emailSli
      tags: [SLA]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formats]
              properties:
                month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', description: A calendar month. Not with `window`. }
                window:
                  type: object
                  description: 'A window of whole hours that is not a calendar month. Both times are needed, on the hour in the report''s time zone, and the window may be at most 366 days. Not with `month`.'
                  properties:
                    from: { type: integer, minimum: 0, description: 'The start, in Unix seconds.' }
                    to: { type: integer, minimum: 0, description: 'The end, in Unix seconds.' }
                dayHours: { type: string, pattern: '^\d{1,2}-\d{1,2}$', description: 'Count only these hours of the day, as `8-17`. As on `/api/sli`.' }
                days: { type: string, pattern: '^[1-7](,[1-7])*$', description: 'Count only spans that begin on these days of the week, Monday 1 to Sunday 7.' }
                formats:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, enum: [pdf, xlsx, csv] }
                  description: Each once. They are attached in the order pdf, xlsx, csv whatever order is given.
                to:
                  type: array
                  maxItems: 40
                  items: { type: string }
                  description: 'One to ten plain addresses. Left out: the saved list.'
                remember: { type: boolean, description: 'Save `to` as the list the portal uses from now on, if the report goes.' }
                style:
                  type: object
                  properties:
                    decimal: { type: string, enum: [dot, comma] }
                    date: { type: string, enum: [long, numeric, iso] }
                    separator: { type: string, enum: [comma, semicolon] }
                  description: The same choices as the export route. Each left out takes its default.
      responses:
        '200':
          description: The mail server took the message.
          content:
            application/json:
              schema:
                type: object
                required: [sent, refused, month, files, remembered]
                properties:
                  sent: { type: integer, description: How many recipients the server took the message for. }
                  refused: { type: integer, description: How many it refused. The message still went to the others. }
                  month: { oneOf: [{ type: string }, { type: 'null' }], description: 'The month the report was for, or null for a window.' }
                  from: { type: integer, description: 'The window''s start. Only for a window.' }
                  to: { type: integer, description: 'The window''s end. Only for a window.' }
                  files:
                    type: array
                    items:
                      type: object
                      required: [format, fileName, bytes]
                      properties:
                        format: { type: string, enum: [pdf, xlsx, csv] }
                        fileName: { type: string, description: 'The attached file, named as `/api/sli/export` names it.' }
                        bytes: { type: integer }
                  remembered: { type: boolean, description: 'Whether the list was saved. False when it was not asked for, and when saving it failed after the report had gone.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `forbidden`, the role is below admin, or `csrf`, a cookie request without `X-HCML-CSRF: 1` or from another site (`CsrfRefused`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: |
            `rate_limited`. This person has sent 5 reports in the last hour; `Retry-After` says how many seconds remain. The
            portal-wide limit (`RateLimited`) answers in the same shape.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: '`mail_error`, the mail server did not take the report, `empty_report`, neither method found a device in that month, so the report would have been empty, or `zabbix_error`. The message says which setting to check, or where to look.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: '`mail_disabled`, email is not set up on this portal, or it is off while sign-in is off and `ALLOW_EMAIL_WITHOUT_AUTH` is not true, `data_not_read_yet` (no reading is newer than the start of the range; `Retry-After`; see `SliUnavailable`), or a Zabbix state (`zabbix_timeout`, `zabbix_auth`).'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/sli/recipients:
    put:
      summary: Replace the saved list of people a report goes to
      description: |
        **admin.** Saves `recipients` as the list the portal uses from now on, for a report sent by hand and for the monthly
        send, with the checks every list has: one to ten plain addresses, once each (a repeat of any case is dropped), each in
        `allowedDomains` when that list is not empty. A list that fails a check is a 400 with a sentence that says which address
        and why, and the list the portal had is kept. An empty list is refused: delete the saved list instead. Any other field
        in the body is a 400. It is refused with a 503 `mail_disabled` while sign-in is off, unless `ALLOW_EMAIL_WITHOUT_AUTH=true`.

        One log line records who, from where and how many, and never an address.
      operationId: putSliRecipients
      tags: [SLA]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipients]
              properties:
                recipients:
                  type: array
                  maxItems: 40
                  items: { type: string }
                  description: 'One to ten plain addresses.'
      responses:
        '200':
          description: The list is saved.
          content:
            application/json:
              schema:
                type: object
                required: [recipients, saved]
                properties:
                  recipients: { type: array, items: { type: string }, description: The list that applies now. }
                  saved: { type: integer, description: How many addresses the saved list holds. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `forbidden`, the role is below admin, or `csrf`, a cookie request without `X-HCML-CSRF: 1` or from another site (`CsrfRefused`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500':
          description: '`state_error`, the portal could not write its data folder. The list it had is kept.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: '`mail_disabled`, email is off while sign-in is off and `ALLOW_EMAIL_WITHOUT_AUTH` is not true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      summary: Delete the saved list of people a report goes to
      description: |
        **admin.** Empties the portal's own list. The list in `MAIL_TO` applies again from then on, which may be empty. It is
        refused with a 409 `schedule_uses_list` while the monthly schedule is on and `MAIL_TO` holds nobody, because the next send
        would have no one to go to: turn the schedule off, or save another list, first. It is refused with a 503 `mail_disabled`
        while sign-in is off, unless `ALLOW_EMAIL_WITHOUT_AUTH=true`. The answer says how many addresses were removed. It takes no body: the portal's own client sends none, and
        a request that names a JSON content type with an empty body is a 400.

        One log line records who, from where and how many, and never an address.
      operationId: deleteSliRecipients
      tags: [SLA]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The saved list is empty.
          content:
            application/json:
              schema:
                type: object
                required: [recipients, removed]
                properties:
                  recipients: { type: array, items: { type: string }, description: 'The list that applies now: the one in `MAIL_TO`, or nobody.' }
                  removed: { type: integer, description: How many addresses the saved list held. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `forbidden`, the role is below admin, or `csrf`, a cookie request without `X-HCML-CSRF: 1` or from another site (`CsrfRefused`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`schedule_uses_list`, the monthly schedule is on and nothing else says who gets the report.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500':
          description: '`state_error`, the portal could not write its data folder. The list it had is kept.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: '`mail_disabled`, email is off while sign-in is off and `ALLOW_EMAIL_WITHOUT_AUTH` is not true.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/maps:
    get:
      summary: Zabbix maps
      description: Cached 60 s.
      operationId: getMaps
      tags: [Maps]
      responses:
        '200':
          description: Map list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [sysmapid, name, width, height]
                  properties:
                    sysmapid: { type: string }
                    name: { type: string }
                    width: { type: string }
                    height: { type: string }
                  additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/maps/detail:
    get:
      summary: One map with its elements resolved
      description: |
        Cached 30 s. **Returns an array, not a single object**: the maps `map.get` found for `mapid`, which
        is one. Each has the map's own fields, its `links`, and its `selements`, the elements drawn on it.
        Each element is the raw Zabbix element with a macro-expanded `labelText` and, for a host element, also
        `hostid`, `hostName`, `problems` and `maxSeverity`.

        The shape is open by construction: the handler spreads whatever Zabbix returns.
      operationId: getMapDetail
      tags: [Maps]
      parameters:
        - name: mapid
          in: query
          required: true
          schema: { type: string, pattern: '^\d+$' }
      responses:
        '200':
          description: Map detail.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MapDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ZabbixError' }
        '503': { $ref: '#/components/responses/ZabbixUnavailable' }

  /api/explain/problem:
    get:
      summary: Plain-language explanation of one problem
      description: |
        Cached 1 h, keyed by the event id together with its acknowledged and resolved state, so
        an explanation is not reused after the problem changes. It follows the Problems and Dashboard pages: a person who holds only the Assistant page does not have it (SC-62).

        Buffered JSON, not streamed. This path sends the host name, trigger name, opdata, severity,
        start time and flags to the model, and the problem's tags (up to 20) only to a model on this
        machine: in `hcml-portal` that means the rest leaves the machine and the tags do not (SC-72).
      operationId: explainProblem
      tags: [AI]
      parameters:
        - name: eventid
          in: query
          required: true
          schema: { type: string, pattern: '^\d+$' }
      responses:
        '200':
          description: The explanation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemExplanation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '499': { $ref: '#/components/responses/Cancelled' }
        '429':
          description: |
            `rate_limited`, more calls than the per-user limit a minute (`AI_CHAT_PER_MINUTE` and `AI_EXPLAIN_PER_MINUTE`, 10 each by default), or, with a
            local model, a call of the same person that is still waiting or running (one for each person); or `ai_budget`, the daily token budget is used
            up (hosted Claude and a model at an outside address, counted by the tokens it reports or else by the size of what went in and out; `AI_DAILY_TOKENS_PER_USER` and `AI_DAILY_TOKENS_TOTAL`). `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`not_found`, no open problem with that event id.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502': { $ref: '#/components/responses/AiError' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/explain/sla:
    get:
      summary: Plain-language explanation of an SLA figure
      description: |
        Cached 300 s. **Two mutually exclusive modes.**

        With `source=derived` it explains the portal's own monthly figure and takes `month`,
        `profile` and `scope`, where scope is `overall`, `site:<code>` or `category:<NAME>`; an
        unmatched scope is 404. Otherwise it explains a Zabbix-native SLA and requires `slaid`.

        `noData: true` marks an answer produced without calling the model because there was
        nothing to measure.

        It follows the SLA and Services pages: a person who holds only the Assistant page does not have it (SC-62).
      operationId: explainSla
      tags: [AI]
      parameters:
        - name: source
          in: query
          description: '`derived` selects the portal''s figure. Any other value selects Zabbix''s.'
          schema: { type: string, enum: [derived] }
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - name: profile
          in: query
          schema: { type: string, enum: [availability, hcml-report] }
        - name: scope
          in: query
          schema: { type: string, default: overall }
        - name: slaid
          in: query
          description: Required when `source` is not `derived`.
          schema: { type: string, pattern: '^\d+$' }
        - name: serviceid
          in: query
          schema: { type: string, pattern: '^\d+$' }
      responses:
        '200':
          description: The explanation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '499': { $ref: '#/components/responses/Cancelled' }
        '429':
          description: |
            `rate_limited`, more calls than the per-user limit a minute (`AI_CHAT_PER_MINUTE` and `AI_EXPLAIN_PER_MINUTE`, 10 each by default), or, with a
            local model, a call of the same person that is still waiting or running (one for each person); with `source=derived`, also more than four of the person's reads of the derived SLA at once (`Retry-After` 10); or `ai_budget`, the daily token budget is used
            up (hosted Claude and a model at an outside address, counted by the tokens it reports or else by the size of what went in and out; `AI_DAILY_TOKENS_PER_USER` and `AI_DAILY_TOKENS_TOTAL`). `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`not_found`, unknown scope, or unknown `slaid`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502': { $ref: '#/components/responses/AiError' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  /api/chat/warm:
    get:
      summary: Ask the model backend to load
      description: |
        Fire and forget. Returns 202 immediately and does the work detached: the only 202 in
        the API.

        On every provider it builds the snapshot of the estate that the first question reads, and so
        reads Zabbix, and starts the derived SLA figures that the snapshot holds when they are cold. On the hosted
        provider that is all it does; on a local model it also loads the weights and has them read the
        snapshot, so the first real question is not paying for a cold start.
      operationId: warmChat
      tags: [AI]
      responses:
        '202':
          description: Warming started.
          content:
            application/json:
              schema:
                type: object
                required: [warming]
                properties:
                  warming: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: '`ai_disabled`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/chat:
    post:
      summary: Ask the assistant (SSE)
      description: |
        `text/event-stream`, streamed token by token, never cached.

        The request body is normalised rather than strictly validated: blank turns are dropped, each
        turn is silently truncated at 2,000 characters, and the oldest turns are dropped until the
        whole history fits a 3,000-character budget. What *is* rejected with 400: a non-array or
        empty `messages`, a bad `role`, a non-string `content`, or a conversation not ending in a
        user turn.

        Four event names:

        | Event | Payload |
        |---|---|
        | `context` | the estate snapshot's metadata, counts and a `truncated` flag; for a user whose pages show only part of the estate, `shown` names the parts the model was given, and the counts of the others are 0 |
        | `token` | `{ "t": string }`, concatenate in order |
        | `done` | `{ ms, text, firstTokenMs, truncated, remembered, language }`: `text` is the cleaned answer and replaces the concatenated tokens; `truncated` is true when the model stopped at its length limit; `remembered` is how many turns of the conversation the model was given, the question included, so the page can show where its memory ends (FR-72); `language` is the one the answer was asked in, `en` or `id` (UX-73) |
        | `error` | `{ "message": string }` |

        Once the response is hijacked the HTTP status can no longer change, so failures after that
        point arrive as an `error` frame on a 200. Its message is fixed wording, as on `AiError`.

        The snapshot and the focused-site block are sent between `~~~ BEGIN` and `~~~ END` lines and
        the system prompt says they are data. Host, site, problem and service names in them are cut to
        one line, with control characters removed, and capped at 80 characters (hosts and sites) or 200
        (problems, services and SLAs), so text typed into a device cannot pose as an instruction.
      operationId: chat
      tags: [AI]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
      responses:
        '200':
          description: The stream opens.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRefused' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: |
            `rate_limited`, more calls than the per-user limit a minute (`AI_CHAT_PER_MINUTE` and `AI_EXPLAIN_PER_MINUTE`, 10 each by default), or, with a
            local model, a call of the same person that is still waiting or running (one for each person); or `ai_budget`, the daily token budget is used
            up (hosted Claude and a model at an outside address, counted by the tokens it reports or else by the size of what went in and out; `AI_DAILY_TOKENS_PER_USER` and `AI_DAILY_TOKENS_TOTAL`). `Retry-After` says how long to wait.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: '`ai_disabled`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/problems/acknowledge:
    post:
      summary: Acknowledge and optionally close problems
      description: |
        **operator. The only write in the entire portal.**

        Four independent gates: a separate `ZABBIX_WRITE_TOKEN` (the read token can never write),
        the operator role, a 503 when the write token is unset, and a 503 when sign-in is off, unless
        the dev opt-in `ALLOW_WRITE_WITHOUT_AUTH=true` is set (with sign-in off every caller is admin). `GET /api/health` exposes
        `writeBack` so the UI can hide the buttons rather than offer a call that will fail.

        Closing additionally requires the trigger to permit manual close; `GET /api/problems` carries
        `manualClose` per problem so the UI never offers a Close that Zabbix will reject.

        After a successful write the cache prefixes of the problem views (`STALE_AFTER_WRITE` in `services/actions.ts`) are invalidated with a 15 s hold, and the change
        is pushed immediately to every open SSE client.

        Zabbix files every write under the write token's owner, so the portal user is put into the text:
        the message Zabbix gets always starts with `[portal:<user>]`, also when the caller sent none.
        Every attempt, refusal and failure is logged with the user, the address, the event ids and the
        action. One request may name at most 50 event ids.

        `message` is silently truncated at 2,048 characters, tag included. `acknowledge` defaults to true. Types
        are checked, not coerced: a body that is not a JSON object, a `message` that is not text, or an
        `acknowledge` or `close` that is not a boolean, such as the text `"false"`, is a 400.
      operationId: acknowledgeProblems
      tags: [Problems]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventids]
              properties:
                eventids:
                  description: One id or an array. Non-string members are dropped silently.
                  oneOf:
                    - type: string
                    - type: array
                      maxItems: 50
                      items: { type: string, pattern: '^\d+$' }
                message: { type: string, maxLength: 2048 }
                close: { type: boolean, default: false }
                acknowledge: { type: boolean, default: true }
      responses:
        '200':
          description: Written. `action` is the Zabbix bitmask, close 1, acknowledge 2, message 4.
          content:
            application/json:
              schema:
                type: object
                required: [ok, eventids, action]
                properties:
                  ok: { type: boolean, const: true }
                  eventids: { type: array, items: { type: string } }
                  action: { type: integer }
        '400':
          description: |
            No usable event ids, more than 50 of them, a non-numeric id, a body or field of the wrong type, or nothing to do:
            `acknowledge: false` with no `close` and no `message`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `forbidden`, the role is below operator, or `csrf`, a cookie request without
            `X-HCML-CSRF: 1` or from another site (`CsrfRefused`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429':
          description: |
            `rate_limited`. This person has acknowledged or closed more than `ACTION_EVENTS_PER_MINUTE` events in the last minute (200 by default, 50 at the least),
            counted by event id and only for a request that would be written; `Retry-After` says how long to wait. The portal-wide limit (`RateLimited`) answers in the same shape.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: |
            `zabbix_error`. When Zabbix answered with an error, the message says that Zabbix refused the change and may already have
            closed the problem, or the account may not be allowed to change it; Zabbix's own words go to the log. When the portal
            cannot tell what Zabbix did with the request (an error page, a body that is not JSON-RPC, or a connection that failed
            when the request may have left), it says the change may or may not have been made. When Zabbix could not be reached
            at all, it says the data source is not answering.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: |
            `zabbix_write_disabled`, `ZABBIX_WRITE_TOKEN` is not set, or sign-in is off and `ALLOW_WRITE_WITHOUT_AUTH` is not true.
            Or `zabbix_timeout`: Zabbix did not answer in time, and the message says that the change may or may not have been made.
            Or `zabbix_auth`, Zabbix rejected the write token.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }


  /api/sli/schedule:
    get:
      summary: 'The monthly send: whether it can run here, how it is set, when it goes next, and what was sent'
      description: |
        **admin.** What the Schedule dialog shows. `available` is false, with `why` in a sentence, when email is not set up (or is off while sign-in is off, unless `ALLOW_EMAIL_WITHOUT_AUTH=true`), when
        `MAIL_SCHEDULE=off` switches the schedule off on this machine, or when the portal has no `PORTAL_STATE_DIR` to keep a schedule
        in (a schedule that would not survive a restart must not look as if it would). `schedule` is null until one is saved. `next`
        is the month the next send is for and the moment it goes (Unix seconds), `retrying` when a send has failed and is waiting to
        be tried again; it is null when the schedule is off or not available. `sends` are the portal's last twelve sends, those made
        by hand and those made by the schedule, newest first, with counts and never an address.
      operationId: getSliSchedule
      tags: [SLA]
      responses:
        '200':
          description: The schedule as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportScheduleView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Set the monthly send
      description: |
        **admin.** Replaces the schedule in one step, and the saved recipients with it: a list that is not empty replaces the saved one, and an empty list with `enabled: false` leaves the saved one as it was. The report of a month goes on day `day` of the month
        after it, at `time` in the report's time zone; Zabbix gets ten minutes after that to hold the last values, and a send that
        fails is tried again after 15 minutes, an hour, and every four hours for a week. A slot that came before the schedule was
        turned on, or before its day or time was changed, is never sent late. `notify` are up to three people who are told, once
        after the third failed try and once when the portal stops trying. `recipients` must hold at least one address while the schedule
        is on; every address, in both lists, must be in `allowedDomains` when that list is not empty. Any other field, in the body or in `style`, is a 400.

        Refused with 503 `schedule_unavailable` where `GET` says `available: false`. Every change is logged with the user, what was set
        and how many people, never who.
      operationId: putSliSchedule
      tags: [SLA]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, day, time, formats, recipients, notify]
              properties:
                enabled: { type: boolean }
                day: { type: integer, minimum: 1, maximum: 28, description: 'Days 29 to 31 are left out so that every month has the day.' }
                time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: '24 hours, in the report time zone.' }
                formats:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, enum: [pdf, xlsx, csv] }
                recipients: { type: array, maxItems: 40, items: { type: string }, description: 'One to ten plain addresses while the schedule is on; up to ten while it is off, where an empty list keeps the saved one.' }
                notify: { type: array, maxItems: 10, items: { type: string }, description: 'Up to three plain addresses.' }
                style:
                  type: object
                  properties:
                    decimal: { type: string, enum: [dot, comma] }
                    date: { type: string, enum: [long, numeric, iso] }
                    separator: { type: string, enum: [comma, semicolon] }
      responses:
        '200':
          description: The schedule as it now stands, the same answer as `GET`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportScheduleView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `forbidden`, the role is below admin, or `csrf`, a cookie request without `X-HCML-CSRF: 1` or from another site (`CsrfRefused`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500':
          description: '`state_error`, the portal could not save it (the data folder cannot be written), or `internal`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: '`schedule_unavailable`, the schedule cannot run on this portal. The message says what to change.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hcml_session
      description: |
        The browser's scheme. The JWT in an httpOnly, SameSite=Strict cookie, set by
        `POST /api/auth/login`, `POST /api/auth/refresh` and `POST /api/auth/password` and cleared by `POST /api/auth/logout`.
        Expires after `SESSION_HOURS` (12 hours by default), renewable while valid, carries
        `{ sub, role, ep, jti, sid }`. The name is `SESSION_COOKIE`,
        default `hcml_session`. Cookies ignore ports, so the Docker stack of hcml-portal-ollama
        (port 8082) names it `hcml_session_ollama`, or signing in to one portal would replace the
        other's session. Unsafe methods sent with this cookie need `X-HCML-CSRF: 1` (`CsrfHeader`).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The same JWT in an `Authorization` header, for scripts and tests: take it from the login
        response's `Set-Cookie` header. Wins when a request carries the cookie too. Needs no
        `X-HCML-CSRF` header, except on sign-in, sign-out and the request for an account, which always need it.

  parameters:
    CsrfHeader:
      name: X-HCML-CSRF
      in: header
      required: false
      description: |
        Must be `1` on sign-in, sign-out, the request for an account and every `POST`, `PUT`, `PATCH` or `DELETE` that
        authenticates with the session cookie. A page on another site cannot add a custom header
        without a CORS preflight, which the BFF answers only for `WEB_ORIGIN`. Not needed with a
        Bearer header, except on sign-in, sign-out and the request for an account.
      schema: { type: string, const: '1' }

  headers:
    SetSessionCookie:
      description: |
        The session cookie, `hcml_session=<jwt>` with a `Max-Age` of the session length (43200 at the default
        12 hours), `Path=/`, `HttpOnly` and
        `SameSite=Strict`, plus `Secure` when the request arrived over HTTPS (`X-Forwarded-Proto: https`
        behind a proxy trusted by `TRUST_PROXY`). The name follows `SESSION_COOKIE`.
      schema: { type: string }

  responses:
    BadRequest:
      description: '`bad_request`, a query parameter or the request body failed validation.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: '`unauthorized`, missing or expired portal JWT. Not the same as `zabbix_auth`.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: '`forbidden`, authenticated, but the role is below what this path requires, or the user does not hold a module that owns it. `password_change_required` when the password is a temporary one.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: '`not_found`, there is no such user, or no such request for an account.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: '`conflict`, the change cannot be made: the name is taken, the user is kept in `.env`, there is no data folder, or it would leave no administrator who can sign in.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CsrfRefused:
      description: |
        `csrf`, a possible cross-site forgery: an unsafe request sent with the session cookie, or a
        sign-in or sign-out, without `X-HCML-CSRF: 1`, or with an `Origin` naming another site or
        `null`. Answered before the guard, so it comes before any 401.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: |
        Body over Fastify's 1 MiB default, or over the limit of the route, which is 4 KB on `POST /api/auth/login`, `POST /api/auth/password` and `POST /api/users/{name}/password`, 8 KB on `POST /api/auth/request`, `POST /api/users`, `PATCH /api/users/{name}` and the approval of a request, and 1 KB on the refusal of a request.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: |
        300 requests per minute per client, counted before the guard, so refused requests count too.
        `/api/health`, `/api/stream` and `POST /api/auth/logout` are exempt. The stream has its own cap
        instead, `429 too_many_streams`, described under `/api/stream`. `Retry-After` says how many seconds to wait.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Cancelled:
      description: |
        `cancelled`, a slow read dropped because the connection of the person who asked closed while it waited for a place
        (BK-59). Nobody is there to read it, so it matters to a script that gives up and to a log reader: the handler writes
        no line of its own.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Internal:
      description: '`internal`. The message is fixed; the detail is in the BFF log only.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UsersError:
      description: |
        `users_error`, the file of users could not be saved, for example because the data volume is full or read-only. The message says to check the data folder; the detail is in the BFF log only (BK-99).
        Any other failure is `internal`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RequestsError:
      description: |
        `requests_error`, the file of requests for an account could not be saved, for example because the data volume is full or read-only. The message says to check the data folder; the detail is in the BFF log only.
        Any other failure is `internal`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SliUnavailable:
      description: |
        `data_not_read_yet`: the request is right and the figures are not there yet, because no reading is newer than the start of the range and the month could not be read again now. `Retry-After` says 60 seconds,
        and the same request is answered once the next read has run (BK-80). Or `zabbix_timeout`, `zabbix_auth`, as for any read (`ZabbixUnavailable`).
      headers:
        Retry-After:
          description: Seconds to wait before asking again (`data_not_read_yet`).
          schema: { type: integer }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SignInOff:
      description: |
        `sign_in_off`, the users cannot be managed while sign-in is off (`AUTH_ENABLED=false`). The guard that tells an administrator from anyone else is not installed then, so these routes refuse everyone (SC-59).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ZabbixError:
      description: '`zabbix_error`, unreachable, non-2xx, non-JSON-RPC, or a JSON-RPC error.'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ZabbixUnavailable:
      description: |
        `zabbix_timeout` (no answer within `ZABBIX_TIMEOUT_MS`, default 300 s in Docker and 10 s in a bare run) or `zabbix_auth` (Zabbix
        rejected the API token). Both are configuration states rather than upstream faults, which is
        why they are 503 and not 504.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AiError:
      description: |
        `ai_error`, the model could not be reached, took too long, returned an error, answered
        unusably or refused the portal's key (the sentence then says that trying again will not help). The message is one fixed sentence for the cause. The model's address and what it sent
        back go to the BFF log only.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AiUnavailable:
      description: |
        `ai_disabled` (not configured) or `ai_busy` (the single concurrency slot is taken: carries
        `Retry-After: 10`).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      required: [error, message]
      description: The only error shape this server produces, at every status.
      properties:
        error: { type: string, description: A stable machine-readable code. }
        message: { type: string, description: Safe to show a user. Never contains the Zabbix URL. }
        requestId:
          type: string
          description: The reply's `X-Request-Id`. Quote it to an admin, who finds the request in the BFF log (`reqId`) and in nginx's (`rid=`).

    ReportScheduleView:
      type: object
      required: [available, why, timezone, schedule, recipients, next, sends, max, maxNotify, allowedDomains]
      description: The monthly send as the Schedule dialog shows it.
      properties:
        available: { type: boolean }
        why: { type: string, description: 'Empty when available; otherwise a sentence that says what to change.' }
        timezone: { type: string, description: The time zone `time` is read in; the report's own. }
        schedule:
          type: [object, 'null']
          description: Null until one is saved.
          required: [enabled, day, time, formats, style, notify, setBy, setAt]
          properties:
            enabled: { type: boolean }
            day: { type: integer }
            time: { type: string }
            formats: { type: array, items: { type: string, enum: [pdf, xlsx, csv] } }
            style:
              type: object
              required: [decimal, date, separator]
              properties:
                decimal: { type: string, enum: [dot, comma] }
                date: { type: string, enum: [long, numeric, iso] }
                separator: { type: string, enum: [comma, semicolon] }
            notify: { type: array, items: { type: string } }
            setBy: { type: string }
            setAt: { type: integer, description: Unix seconds. }
        recipients: { type: array, items: { type: string }, description: 'The saved recipients, which the button and the schedule share.' }
        next:
          type: [object, 'null']
          required: [month, at, retrying]
          properties:
            month: { type: string, description: The month the next report is for. }
            at: { type: integer, description: 'Unix seconds: when it goes, or when the next try is.' }
            retrying: { type: boolean }
        sends:
          type: array
          description: The last twelve, newest first. Counts only.
          items:
            type: object
            required: [month, trigger, by, at, outcome, attempts, formats, recipients, refused, bytes]
            properties:
              month: { type: string }
              trigger: { type: string, enum: [schedule, manual] }
              by: { type: string, description: 'A user name, or "schedule".' }
              at: { type: integer }
              outcome: { type: string, enum: [sending, sent, failed, missed] }
              attempts: { type: integer }
              formats: { type: array, items: { type: string, enum: [pdf, xlsx, csv] } }
              recipients: { type: integer }
              refused: { type: integer }
              bytes: { type: integer }
              reason: { type: string, description: 'A word for why it failed: a mail failure kind, `zabbix`, `recipients`, `empty`, `not running` or `error`.' }
        max: { type: integer }
        maxNotify: { type: integer }
        allowedDomains: { type: array, items: { type: string } }

    Ready:
      type: object
      required: [ok, zabbix, zabbixMs, model, checkedAt, version, startedAt, build, streams, logFile]
      properties:
        ok: { type: boolean, description: The portal can read Zabbix. The model never changes it. }
        zabbix: { type: string, enum: [ok, token_rejected, timeout, error] }
        zabbixMs:
          type: [integer, 'null']
          description: How long the Zabbix call took. Null when it did not answer.
        model:
          type: string
          enum: [ok, down, missing, off, not_checked]
          description: '`off` is no model configured, `missing` is a model server that answers without `AI_MODEL` in its list (a forgotten `ollama pull`, a mistyped name), `not_checked` is the hosted Anthropic model, which a probe would bill.'
        checkedAt: { type: integer, description: 'When these answers were read, milliseconds since epoch.' }
        version: { type: string, description: The server package version. }
        startedAt: { type: string, format: date-time, description: When this process started. }
        build:
          type: object
          required: [commit, time]
          description: The image's `BUILD_COMMIT` and `BUILD_TIME` build arguments. `unknown` when not given or empty, and cut to 64 characters.
          properties:
            commit: { type: string }
            time: { type: string }
        streams: { type: integer, minimum: 0, description: Screens connected to `/api/stream` right now. }
        logFile: { $ref: '#/components/schemas/LogFile' }

    LogFile:
      type: object
      required: [state, written]
      description: Whether the server's own copy of its log (`bff.log`, in the `portal-logs` volume) is being written (IN-83).
      properties:
        state:
          type: string
          enum: [off, ok, failing]
          description: '`off` when `LOG_DIR` is empty, so the log goes to stdout alone. `failing` while the file cannot be written; the lines still go to stdout.'
        written: { type: integer, minimum: 0, description: 'The bytes that have reached the file since the process started, rotations included.' }

    User:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, enum: [guest, operator, admin] }
        displayName: { type: string, description: 'The name shown, on `GET /api/auth/me`.' }
        source:
          type: string
          enum: [env, file]
          description: 'On `GET /api/auth/me`: `env` for an account kept in `.env`, which cannot change its password on the Account page (FR-73), `file` for one of the file of users.'
        language: { type: string, enum: [en, id], description: 'The language the person chose for the Assistant, on `GET /api/auth/me`, when they chose one.' }

    ModuleId:
      type: string
      enum: [dashboard, problems, sites, hosts, devices, latest, graphs, maps, network, links, services, sla, capacity, noise, top-triggers, inventory, assistant, users]
      description: One page of the menu. `inventory` and `users` are for administrators and cannot be given to anyone else.

    ModuleInfo:
      type: object
      required: [id, label, page, adminOnly]
      properties:
        id: { $ref: '#/components/schemas/ModuleId' }
        label: { type: string }
        page: { type: string, description: 'The path of its page, such as `/network`.' }
        adminOnly: { type: boolean, description: 'Its page needs the administrator role, so it cannot be given to anyone else.' }

    NewUser:
      type: object
      required: [name, role, password]
      properties:
        name: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [guest, operator, admin] }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
        language: { oneOf: [{ type: string, enum: [en, id] }, { type: 'null' }] }
        password: { type: string }
        expires: { oneOf: [{ type: integer }, { type: 'null' }] }
        mustChange: { type: boolean }

    UserPatch:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string }
        role: { type: string, enum: [guest, operator, admin] }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
        language: { oneOf: [{ type: string, enum: [en, id] }, { type: 'null' }] }
        disabled: { type: boolean }
        expires: { oneOf: [{ type: integer }, { type: 'null' }] }
        mustChange: { type: boolean }

    UserRecord:
      type: object
      description: A user as the Users page reads them. Never a password or a hash.
      required: [name, displayName, role, modules, language, source, breakGlass, disabled, expires, mustChange, created, createdBy, lastSignIn]
      properties:
        name: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [guest, operator, admin] }
        modules: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
        language: { oneOf: [{ type: string, enum: [en, id] }, { type: 'null' }] }
        source:
          type: string
          enum: [env, file]
          description: '`env` for a user kept in `.env`, which the page cannot change; `file` for one of the file of users.'
        breakGlass: { type: boolean, description: 'The first administrator of `.env`: it signs in with the password in `.env` whatever the state of the file.' }
        disabled: { type: boolean }
        expires: { oneOf: [{ type: integer }, { type: 'null' }], description: 'Unix seconds after which the user cannot sign in, or null.' }
        mustChange: { type: boolean }
        created: { oneOf: [{ type: integer }, { type: 'null' }] }
        createdBy: { oneOf: [{ type: string }, { type: 'null' }] }
        lastSignIn: { oneOf: [{ type: integer }, { type: 'null' }] }

    AccountRequestInfo:
      type: object
      required: [enabled]
      description: What the sign-in page asks before it offers the form for a request for an account (FR-62).
      properties:
        enabled: { type: boolean, description: 'False unless ACCOUNT_REQUESTS is on, sign-in is on, and there is a data folder.' }
        pages:
          type: array
          description: The pages a person may ask for. Only when `enabled`.
          items:
            type: object
            required: [id, label]
            properties:
              id: { $ref: '#/components/schemas/ModuleId' }
              label: { type: string }
        nameMax: { type: integer, description: 'The longest name kept. Only when `enabled`.' }
        reasonMax: { type: integer, description: 'The longest reason kept. Only when `enabled`.' }

    AccountRequestBody:
      type: object
      additionalProperties: false
      required: [name, pages, reason]
      properties:
        name: { type: string, maxLength: 400 }
        pages: { type: array, maxItems: 64, items: { type: string, maxLength: 64 } }
        reason: { type: string, maxLength: 4000 }

    AccountRequest:
      type: object
      required: [id, name, pages, reason, created]
      properties:
        id: { type: string }
        name: { type: string }
        pages: { type: array, items: { $ref: '#/components/schemas/ModuleId' } }
        reason: { type: string }
        created: { type: integer, description: Unix seconds when it was left. }

    AccountRequestList:
      type: object
      required: [enabled, max, requests]
      properties:
        enabled: { type: boolean, description: Whether the portal accepts requests now. }
        max: { type: integer, description: How many requests may wait at once. }
        requests: { type: array, items: { $ref: '#/components/schemas/AccountRequest' } }

    Session:
      type: object
      required: [user, expiresIn]
      description: What sign-in and renewal return. The token is in the `Set-Cookie` header, never here.
      properties:
        user: { $ref: '#/components/schemas/User' }
        mustChange: { type: boolean, description: 'True when the password is a temporary one that must be changed first.' }
        expiresIn: { type: integer, minimum: 7200, maximum: 86400, example: 43200, description: 'Seconds the new session lasts: SESSION_HOURS times 3600, so 43200 (12 hours) by default.' }

    SiteRef:
      type: object
      description: A resolved site. No Zabbix entity corresponds to this.
      required: [code, name]
      properties:
        code: { type: integer, description: 'The site number, 1 to 14.' }
        name: { type: string }
      additionalProperties: true

    HostState:
      type: string
      enum: [up, down, degraded, nodata, disabled]
      description: The portal's reachability judgement, ping first.

    StateReason:
      type: string
      enum: [ping, interface, snmp-silent, agent-silent, stale, no-interface, unsupported, disabled]
      description: Which signal decided `HostState`. Provenance, so a wrong call can be traced.

    ProblemCounts:
      type: object
      required: [total, bySeverity]
      properties:
        total: { type: integer }
        bySeverity: { type: object, additionalProperties: { type: integer } }

    ZHost:
      type: object
      required: [hostid, name, status]
      properties:
        hostid: { type: string }
        name: { type: string }
        status: { type: string, description: '`0` is monitored, `1` is not monitored.' }
        maintenance_status: { type: string, description: '`1` while the host is in maintenance.' }
        interfaces:
          type: array
          items:
            type: object
            required: [ip]
            properties:
              ip: { type: string }
              type: { type: string, description: '`1` agent, `2` SNMP, `3` IPMI, `4` JMX.' }
              available: { type: string, description: '`0` unknown, `1` available, `2` unavailable.' }
            additionalProperties: true
      additionalProperties: true

    Device:
      allOf:
        - $ref: '#/components/schemas/ZHost'
        - type: object
          required: [state, reason, problems, class, category, site]
          properties:
            state: { $ref: '#/components/schemas/HostState' }
            reason: { $ref: '#/components/schemas/StateReason' }
            problems: { $ref: '#/components/schemas/ProblemCounts' }
            site:
              oneOf: [{ $ref: '#/components/schemas/SiteRef' }, { type: 'null' }]
            class:
              type: string
              enum: [switch, firewall, access-point, repeater, server, wan-link, web, other]
            category:
              type: string
              description: The monitoring template the kind was judged by, such as `Cisco IOS by SNMP`, `ICMP Ping` for a host that is only pinged, or `Other`.

    DevicesResponse:
      type: object
      required: [classes, devices]
      properties:
        classes:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string, enum: [switch, firewall, access-point, repeater, server, wan-link, web, other] }
              label: { type: string, description: 'The plural name, such as "Switches".' }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }

    Item:
      type: object
      required: [itemid, name, key_, value_type]
      properties:
        itemid: { type: string }
        hostid: { type: string }
        name: { type: string }
        key_: { type: string }
        value_type: { type: string, description: '`0` float, `1` character, `2` log, `3` unsigned integer, `4` text.' }
        units: { type: string }
        delay: { type: string }
        status: { type: string, description: '`0` enabled, `1` disabled.' }
        state: { type: string, description: '`0` normal, `1` not supported.' }
        flags: { type: string }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        hosts:
          type: array
          description: The host the item belongs to. Present when `itemids` is given, and always on the latest data.
          items:
            type: object
            required: [hostid, name]
            properties:
              hostid: { type: string }
              name: { type: string }
      additionalProperties: true

    LatestItem:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            lastvalue: { type: string, description: 'The newest value. Zabbix looks it up item by item, so only this route returns it.' }
            lastclock: { type: string, description: 'When that value was collected, epoch seconds as text.' }
            prevvalue: { type: string, description: The value before `lastvalue`. }

    Tag:
      type: object
      required: [tag, value]
      properties:
        tag: { type: string }
        value: { type: string }

    Problem:
      type: object
      required: [eventid, objectid, object, name, severity, clock, acknowledged]
      properties:
        eventid: { type: string }
        objectid: { type: string }
        object: { type: string, description: '`0` is a trigger.' }
        name: { type: string }
        severity: { type: string, enum: ['0', '1', '2', '3', '4', '5'] }
        clock: { type: string }
        r_eventid: { type: string, description: '`0` while still open.' }
        r_clock: { type: string }
        acknowledged: { type: string, enum: ['0', '1'] }
        suppressed: { type: string, enum: ['0', '1'] }
        opdata: { type: string }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        host: { type: string, description: Enriched by the BFF. }
        hostid: { type: string, description: Enriched by the BFF. }
        manualClose:
          type: boolean
          description: Whether the trigger permits manual close. Gates the Close button.
      additionalProperties: true

    GraphResponse:
      type: object
      required: [from, to, source, series, latestClock, downsampled]
      properties:
        from: { type: integer }
        to: { type: integer }
        source:
          type: string
          enum: [history, trend, 'trend+history']
          description: Which store answered. `trend+history` means trends stalled and raw filled the tail.
        series:
          type: array
          items: { $ref: '#/components/schemas/GraphSeries' }
        latestClock:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: The newest sample of any series, in epoch seconds. Null when no series has a sample.
        downsampled:
          type: boolean
          description: True when a series had more samples than `points` and was folded into equal time buckets.

    GraphSeries:
      type: object
      required: [itemid, name, host, units, value_type, delaySeconds, step, points, stats, coverage]
      properties:
        itemid: { type: string }
        name: { type: string }
        host: { type: string, description: 'The item''s first host. An empty string when Zabbix names none.' }
        units: { type: string, description: 'An empty string when the item has none.' }
        value_type: { type: string, description: 'The Zabbix value type of the item, `0` float or `3` unsigned integer here.' }
        delaySeconds:
          type: number
          description: |
            Seconds between the item's values: its own interval, or for a dependent item the spacing
            of its history, or `3600` with trends and `60` without when neither is known.
        step: { type: boolean, description: 'Render as a step line, ICMP and other 0/1 series.' }
        points:
          type: array
          items: { $ref: '#/components/schemas/GraphPoint' }
        stats:
          description: Over the samples the series holds. Null when it holds none.
          oneOf:
            - type: object
              required: [min, avg, max, last, lastClock]
              properties:
                min: { type: number }
                avg: { type: number }
                max: { type: number }
                last: { type: number }
                lastClock: { type: integer, description: 'Epoch seconds of the newest sample.' }
            - type: 'null'
        coverage:
          type: object
          required: [coveredSeconds, firstClock, lastClock]
          description: How much of the window the samples cover. The two clocks are epoch seconds, null with no sample.
          properties:
            coveredSeconds: { type: integer }
            firstClock: { oneOf: [{ type: integer }, { type: 'null' }] }
            lastClock: { oneOf: [{ type: integer }, { type: 'null' }] }

    GraphPoint:
      type: array
      description: |
        `[ms, avg, min, max]`: the time in epoch milliseconds, then the average, the minimum and the
        maximum. A null `avg` is an explicit collection gap. `min` and `max` are null for raw history.
      prefixItems:
        - { type: number }
        - oneOf: [{ type: number }, { type: 'null' }]
        - oneOf: [{ type: number }, { type: 'null' }]
        - oneOf: [{ type: number }, { type: 'null' }]
      minItems: 4
      maxItems: 4

    NetDevice:
      type: object
      required: [hostid, name, status]
      properties:
        hostid: { type: string }
        name: { type: string }
        status: { type: string }
        site:
          oneOf: [{ $ref: '#/components/schemas/SiteRef' }, { type: 'null' }]
        icmp:
          description: Null when the host has no ICMP items. `up`, `loss` and `latency` are there only when a fresh value exists.
          oneOf:
            - type: object
              required: [state]
              properties:
                up: { type: boolean }
                loss: { type: number }
                latency: { type: number }
                state: { type: string, enum: [up, down, unknown] }
            - type: 'null'

    TopHostsResponse:
      type: object
      required: [generatedAt, metrics]
      properties:
        generatedAt: { type: integer, description: Epoch seconds. }
        metrics:
          type: array
          items:
            type: object
            required: [key, label, considered, current, rows]
            properties:
              key: { type: string, enum: [cpu, memory] }
              label: { type: string }
              considered: { type: integer, description: Hosts that have such an item. }
              current: { type: integer, description: 'Of those, with a current value.' }
              rows:
                type: array
                items:
                  type: object
                  required: [hostid, host, itemid, value, clock]
                  properties:
                    hostid: { type: string }
                    host: { type: string }
                    itemid: { type: string }
                    value: { type: number, description: Percent. }
                    clock: { type: integer, description: 'When the value was collected, epoch seconds.' }

    WebMonitoringResponse:
      type: object
      required: [generatedAt, total, ok, failed, unknown, failures]
      properties:
        generatedAt: { type: integer, description: Epoch seconds. }
        total: { type: integer, description: 'Enabled scenarios on monitored hosts. It is `ok`, `failed` and `unknown` added up.' }
        ok: { type: integer }
        failed: { type: integer }
        unknown: { type: integer, description: Scenarios with no current result. }
        failures:
          type: array
          items:
            type: object
            required: [hostid, host, name, itemid, step, clock]
            properties:
              hostid: { type: string }
              host: { type: string }
              name: { type: string, description: The scenario's name. }
              itemid: { type: string }
              step: { type: integer, description: 'The step that failed, counting from 1.' }
              clock: { type: integer, description: 'When the result was collected, epoch seconds.' }

    MeterZone:
      type: object
      required: [from, level]
      properties:
        from:
          type: number
          description: Where the zone starts, in the item's units. It ends where the next one starts, or at the top of the scale.
        level:
          type: string
          enum: [none, low, ok, warn, critical]
          description: What the zone's colour in Zabbix means (red is `critical`, orange and yellow `warn`, green `ok`, blue `low`, grey or unset `none`).

    MeterOther:
      type: object
      required: [direction, itemid, value, clock, fraction, zone]
      properties:
        direction: { type: string, enum: [in, out], description: The opposite of the gauge's own direction. }
        itemid: { type: string }
        value: { type: [number, 'null'], description: 'The item''s current value. Null when it has none: it is never read from history.' }
        clock: { type: [integer, 'null'] }
        fraction: { type: [number, 'null'], minimum: 0, maximum: 1 }
        zone: { type: [string, 'null'], enum: [none, low, ok, warn, critical, null] }

    Meter:
      type: object
      required: [id, title, page, host, hostid, item, itemid, direction, link, other, units, value, clock, min, max, zones, fraction, zone, state]
      properties:
        id: { type: string, description: 'Stable for one item (`item-<id>`); a widget without an item is named after its title.' }
        title: { type: string, description: 'The widget''s own title, as HCML wrote it.' }
        page: { type: string, description: The dashboard page the widget sits on. }
        host: { type: [string, 'null'] }
        hostid: { type: [string, 'null'], description: 'The host''s id in Zabbix, which the Graphs page needs.' }
        item: { type: [string, 'null'], description: 'The item''s name, such as "Interface wan1(): Bits received".' }
        itemid: { type: [string, 'null'] }
        direction: { type: [string, 'null'], enum: [in, out, null] }
        link:
          type: string
          enum: [up, down, unknown]
          description: |
            What the interface says about itself, from its status item (IF-MIB ifOperStatus) when that has a
            current value. `down` is 2 (down) or 7 (lowerLayerDown): a link that carries nothing, so a reading
            of 0 is not an idle link. `up` is 1. `unknown` is no current status, or one that is neither
            working nor dead (testing, dormant, not present).
        other:
          description: The opposite direction of the same interface, on the gauge's own scale and zones. Null for a gauge with no direction, or with no item of the opposite direction.
          oneOf:
            - $ref: '#/components/schemas/MeterOther'
            - type: 'null'
        units: { type: string, description: The item's units; every number below is in them. }
        value: { type: [number, 'null'] }
        clock: { type: [integer, 'null'], description: 'When the value was collected, epoch seconds.' }
        min: { type: number }
        max: { type: [number, 'null'], description: 'The top of the scale, the link''s capacity as the widget gives it.' }
        zones: { type: array, items: { $ref: '#/components/schemas/MeterZone' } }
        fraction: { type: [number, 'null'], minimum: 0, maximum: 1 }
        zone: { type: [string, 'null'], enum: [none, low, ok, warn, critical, null] }
        state:
          type: string
          enum: [ok, stale, nodata, unsupported, missing, invalid]
          description: |
            `ok` a current reading. `stale` an old one (value and time are given). `nodata` the item has
            never held a value this portal can read. `unsupported` the item is disabled or Zabbix cannot
            collect it. `missing` the widget points at an item that is gone. `invalid` the widget has no
            usable scale (the value is still given).

    MetersResponse:
      type: object
      required: [dashboard, found, generatedAt, meters, summary]
      properties:
        dashboard: { type: string, description: The dashboard that was looked for. }
        found: { type: boolean }
        generatedAt: { type: integer, description: Epoch seconds. }
        meters: { type: array, items: { $ref: '#/components/schemas/Meter' } }
        summary:
          type: object
          required: [total, current, critical, warn, stale, unavailable, down, otherHigh]
          properties:
            total: { type: integer }
            current: { type: integer, description: With a current reading. }
            critical: { type: integer, description: 'Of those, in a red zone.' }
            warn: { type: integer, description: 'Of those, in a yellow or orange zone.' }
            stale: { type: integer }
            unavailable: { type: integer, description: 'No gauge to draw: no value, unsupported, missing, or a scale that cannot be read.' }
            down: { type: integer, description: 'Links whose interface is down, whatever their reading says.' }
            otherHigh: { type: integer, description: 'Links whose opposite direction is in a yellow, orange or red zone now.' }

    InterfaceRow:
      type: object
      description: One interface, with the `net.if.*` items Zabbix discovers for its SNMP index folded together.
      required:
        [index, name, alias, operStatus, speed, inBps, outBps, utilisation, inErrors, outErrors, inDiscards,
         outDiscards, lastclock, itemids]
      properties:
        index: { type: integer, description: The SNMP interface index. }
        name: { type: string }
        alias: { type: string }
        operStatus:
          type: string
          enum: [up, down, testing, unknown, dormant, notPresent, lowerLayerDown]
          description: IF-MIB `ifOperStatus`.
        speed: { oneOf: [{ type: number }, { type: 'null' }], description: 'Null when no speed is reported or it is zero.' }
        inBps: { oneOf: [{ type: number }, { type: 'null' }] }
        outBps: { oneOf: [{ type: number }, { type: 'null' }] }
        utilisation: { oneOf: [{ type: number }, { type: 'null' }], description: 'Percent of `speed` the busier direction uses, to two decimals. Null without a speed or a reading.' }
        inErrors: { oneOf: [{ type: number }, { type: 'null' }] }
        outErrors: { oneOf: [{ type: number }, { type: 'null' }] }
        inDiscards: { oneOf: [{ type: number }, { type: 'null' }] }
        outDiscards: { oneOf: [{ type: number }, { type: 'null' }] }
        lastclock: { oneOf: [{ type: integer }, { type: 'null' }], description: 'Epoch seconds of the newest fresh value of any of its items. Null when none is fresh.' }
        itemids:
          type: object
          description: The item behind each figure, for a link to its graph.
          properties:
            in: { type: string }
            out: { type: string }
            status: { type: string }
            speed: { type: string }
            inErrors: { type: string }
            outErrors: { type: string }

    LinksResponse:
      type: object
      required: [links, paths, summary, thresholds]
      properties:
        links: { type: array, items: { $ref: '#/components/schemas/Link' } }
        paths:
          type: array
          items:
            type: object
            required: [name, links, state]
            properties:
              name: { type: string }
              links: { type: array, items: { $ref: '#/components/schemas/Link' } }
              state: { $ref: '#/components/schemas/LinkState' }
        summary:
          type: object
          required: [total, up, degraded, down, unknown]
          properties:
            total: { type: integer }
            up: { type: integer }
            degraded: { type: integer }
            down: { type: integer }
            unknown: { type: integer }
        thresholds:
          type: object
          required: [lossWarn, lossCrit]
          description: Echoes `LINK_LOSS_WARN` / `LINK_LOSS_CRIT`, default 2 and 10 percent.
          properties:
            lossWarn: { type: number }
            lossCrit: { type: number }

    LinkState:
      type: string
      enum: [up, degraded, down, unknown]

    Link:
      type: object
      required: [id, hostid, host, target, label, state]
      properties:
        id: { type: string, description: '`<hostid>:<target>`.' }
        hostid: { type: string }
        host: { type: string }
        target: { type: string }
        label: { type: string }
        up: { type: boolean }
        loss: { type: number, description: Percent. }
        latency: { type: number, description: Milliseconds. Zabbix stores seconds. }
        jitter: { type: number, description: 'Max minus min RTT, milliseconds.' }
        state: { $ref: '#/components/schemas/LinkState' }
        group: { type: string, description: From the `link_group` item tag. }
        role: { type: string, description: From the `link_role` item tag. }
        lastclock: { type: string }

    SitesResponse:
      type: object
      required: [sites, coverage]
      properties:
        sites: { type: array, items: { $ref: '#/components/schemas/Site' } }
        coverage:
          type: object
          required: [hosts, tag, name, inventory, group]
          description: How many hosts each site signal accounted for. The standardisation metric.
          properties:
            hosts: { type: integer }
            tag: { type: integer }
            name: { type: integer }
            inventory: { type: integer }
            group: { type: integer }

    Site:
      type: object
      required:
        [name, total, available, unavailable, unknown, up, down, degraded, nodata,
         maintenance, disabled, problems, unacknowledged, bySeverity, worst, hosts]
      properties:
        name: { type: string }
        total: { type: integer }
        available: { type: integer, description: 'By interface flags, as before `state` existed.' }
        unavailable: { type: integer }
        unknown: { type: integer }
        up: { type: integer, description: By derived `state`. Disabled hosts count only in `disabled`. }
        down: { type: integer }
        degraded: { type: integer }
        nodata: { type: integer }
        maintenance: { type: integer }
        disabled: { type: integer }
        problems: { type: integer }
        unacknowledged: { type: integer }
        bySeverity: { type: object, additionalProperties: { type: integer } }
        worst: { type: integer, description: Highest severity firing here; -1 when clear. }
        hosts: { type: array, items: { $ref: '#/components/schemas/SiteHost' } }

    SiteHost:
      type: object
      required: [hostid, name, status, availability, state, reason, siteSource, problems]
      properties:
        hostid: { type: string }
        name: { type: string }
        status: { type: string }
        maintenance_status: { type: string }
        interfaces:
          type: array
          items:
            type: object
            required: [ip]
            properties:
              ip: { type: string }
              type: { type: string }
              available: { type: string }
        availability: { type: string, enum: [available, unavailable, unknown] }
        state: { $ref: '#/components/schemas/HostState' }
        reason: { $ref: '#/components/schemas/StateReason' }
        siteSource: { type: string, enum: [tag, name, inventory, group] }
        problems: { $ref: '#/components/schemas/ProblemCounts' }

    ServicesResponse:
      type: object
      required: [tree, total, degraded, worst]
      properties:
        tree: { type: array, items: { $ref: '#/components/schemas/ServiceNode' } }
        total: { type: integer }
        degraded: { type: integer }
        worst: { type: integer, description: Worst status anywhere; -1 when everything is fine. }
        truncated: { type: boolean, const: true, description: 'Present, and true, when the tree was cut at 5,000 nodes because services that share children appear under each parent.' }

    ServiceNode:
      type: object
      required: [serviceid, name, status, algorithm, tags, problems, children, worst, descendants]
      description: Recursive, depth-capped at 12. The graph is a DAG, so a service below several parents is built under each of them, and `descendants` counts each distinct `serviceid` once.
      properties:
        serviceid: { type: string }
        name: { type: string }
        status: { type: integer, description: '-1 is OK; otherwise the severity that propagated up.' }
        algorithm: { type: string }
        description: { type: string }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        problems:
          type: array
          items:
            type: object
            required: [eventid, name, severity]
            properties:
              eventid: { type: string }
              name: { type: string }
              severity: { type: string }
        sla:
          type: object
          required: [slaid, name, slo, sli, errorBudget, meeting]
          properties:
            slaid: { type: string }
            name: { type: string }
            slo: { type: number }
            sli: { type: number }
            errorBudget: { type: number, description: Seconds still absorbable; negative means missed. }
            meeting: { type: boolean }
        children: { type: array, items: { $ref: '#/components/schemas/ServiceNode' } }
        worst: { type: integer }
        descendants: { type: integer }

    DerivedServicesResponse:
      allOf:
        - $ref: '#/components/schemas/ServicesResponse'
        - type: object
          required: [tree, source, label, month, profile, target, closed, gaps, noDataWindows]
          properties:
            source: { type: string, const: derived }
            label: { type: string }
            month: { type: string }
            profile: { type: string, enum: [availability, hcml-report] }
            target: { type: number }
            closed: { type: boolean }
            gaps: { type: array, items: { $ref: '#/components/schemas/Interval' } }
            noDataWindows:
              type: array
              description: Spans declared not measured (SLA_NO_DATA_WINDOWS), treated as hours with no data.
              items: { $ref: '#/components/schemas/Interval' }
            tree: { type: array, items: { $ref: '#/components/schemas/DerivedServiceNode' } }

    DerivedServiceNode:
      description: A `ServiceNode` of the tree derived from the estate, whose children are of the same kind.
      allOf:
        - $ref: '#/components/schemas/ServiceNode'
        - type: object
          required: [kind, dataStatus, coverage, children]
          properties:
            kind:
              type: string
              enum: [root, business, site, class, wan-path, host, web]
            hostid: { type: string }
            dataStatus: { type: string, enum: [ok, partial, nodata] }
            coverage: { oneOf: [{ type: number }, { type: 'null' }] }
            children: { type: array, items: { $ref: '#/components/schemas/DerivedServiceNode' } }

    Interval:
      type: object
      required: [from, to]
      properties:
        from: { type: integer }
        to: { type: integer }

    ZbxSla:
      type: object
      required: [slaid, name, slo, period, status]
      properties:
        slaid: { type: string }
        name: { type: string }
        period: { type: string, description: '`0` daily, `1` weekly, `2` monthly, `3` quarterly, `4` annually.' }
        slo: { type: string, description: 'The promised availability target in percent, such as `99.9`.' }
        timezone: { type: string }
        description: { type: string }
        status: { type: string, description: '`0` disabled, `1` enabled.' }
      additionalProperties: true

    SlaSli:
      type: object
      required: [serviceid, name, sli, uptime, downtime, error_budget, period_from, period_to]
      properties:
        serviceid: { type: string }
        name: { type: string }
        sli: { type: number, description: 'Achieved availability, percent.' }
        uptime: { type: integer, description: Seconds. }
        downtime: { type: integer, description: Seconds. }
        error_budget: { type: integer, description: Seconds left before the SLO is missed. }
        period_from: { type: integer }
        period_to: { type: integer }

    SliReport:
      type: object
      required:
        [source, label, profile, month, from, to, end, closed, timezone, target, basis,
         overall, categories, sites, classes, hosts, wanPaths, web, gaps, noDataWindows, stats, generatedAt]
      properties:
        source: { type: string, const: derived }
        label: { type: string }
        profile: { type: string, enum: [availability, hcml-report] }
        month: { oneOf: [{ type: string }, { type: 'null' }] }
        from: { type: integer }
        to: { type: integer }
        end: { type: integer, description: '`min(to, now)`, the part of the window that has happened.' }
        closed: { type: boolean }
        timezone: { type: string }
        target: { type: number }
        dailyHours:
          type: object
          required: [start, end, weekdays, seconds]
          description: |
            Present when the window was restricted to hours of the day. Only these hours were measured: `window` of each host is `seconds`, an outage counts as an incident
            when any part of it lies inside them, and `longest` is the longest part inside them.
          properties:
            start: { type: integer, minimum: 0, maximum: 23 }
            end: { type: integer, minimum: 0, maximum: 24, description: 'Not after `start` means the span runs through midnight into the next morning.' }
            weekdays:
              oneOf: [{ type: array, items: { type: integer, minimum: 1, maximum: 7 } }, { type: 'null' }]
              description: Days the spans begin on, Monday 1 to Sunday 7, or null for every day.
            seconds: { type: integer, description: The seconds of the window that the hours keep. }
        basis:
          type: object
          required: [triggers, gapPolicy, noDataPolicy, maintenancePolicy]
          description: What the figure counts, so two profiles can be compared like for like.
          properties:
            triggers: { type: array, items: { type: string } }
            gapPolicy: { type: string, enum: [counted-as-up, excluded] }
            noDataPolicy: { type: string, enum: [counted-as-100, excluded] }
            maintenancePolicy:
              type: string
              enum: [excluded]
              description: |
                Time inside a planned Zabbix maintenance window counts neither as down nor in the
                total, in both profiles. Read from the periods as Zabbix defines them now.
        overall: { $ref: '#/components/schemas/SliGroup' }
        categories: { type: array, items: { $ref: '#/components/schemas/SliGroup' } }
        sites: { type: array, items: { $ref: '#/components/schemas/SliGroup' } }
        classes: { type: array, items: { $ref: '#/components/schemas/SliGroup' } }
        hosts: { type: array, items: { $ref: '#/components/schemas/SliHost' } }
        wanPaths: { type: array, items: { $ref: '#/components/schemas/SliPath' } }
        web: { type: array, items: { $ref: '#/components/schemas/SliWeb' } }
        webTakenAt:
          type: integer
          description: |
            Epoch seconds. Present for a month that has closed under the strict method: when the web check figures in `web` were taken. The first read of the
            month after it closed keeps them, and a later read gives those figures again, whatever the readings in Zabbix say by then (ADR 0016). Absent for a
            month still running, under HCML's method, and on a portal with no data folder to keep them in, where the figures can still change.
        gaps:
          type: array
          description: Estate-wide spans in which almost nothing was collected.
          items: { $ref: '#/components/schemas/Interval' }
        noDataWindows:
          type: array
          description: |
            Spans the setting SLA_NO_DATA_WINDOWS declares not measured, such as a collector that ran outside
            HCML's network. Both methods treat them as hours with no data.
          items: { $ref: '#/components/schemas/Interval' }
        stats:
          type: object
          required: [zabbixCalls, triggers, events, trendRows, ms]
          description: |
            `zabbixCalls` under-counts: sliced `event.get` recursion is counted once, so the true
            figure is higher whenever a window exceeds 5,000 events.
          properties:
            zabbixCalls: { type: integer }
            triggers: { type: integer }
            events: { type: integer }
            trendRows: { type: integer }
            ms: { type: integer }
        generatedAt: { type: integer }

    SliGroup:
      type: object
      description: One roll-up row, for the whole estate or for one category, site or kind of device.
      required: [key, name, hosts, withData, sli, downtime, meeting, belowTarget]
      properties:
        key: { type: string }
        name: { type: string }
        hosts: { type: integer, description: 'Hosts in the group.' }
        withData: { type: integer, description: 'Hosts with enough collected data to have a figure.' }
        sli:
          oneOf: [{ type: number }, { type: 'null' }]
          description: Percent. The plain mean of the figures of the hosts that have one, HCML's own rule for every total. Null when none has.
        downtime: { type: number, description: 'Seconds, summed over the hosts.' }
        meeting:
          oneOf: [{ type: boolean }, { type: 'null' }]
          description: Whether `sli` reaches the target. Null when there is no figure.
        belowTarget: { type: integer, description: 'Hosts whose own figure is below the target.' }

    SliHost:
      type: object
      description: One device in the derived monthly report.
      required:
        [hostid, name, hostStatus, site, category, deviceClass, triggerids, sli, downtime, window, covered,
         maintenance, coverage, incidents, longest, dataStatus, measured, meeting, errorBudget]
      properties:
        hostid: { type: string }
        name: { type: string }
        hostStatus: { type: string, description: 'The Zabbix host status, `0` monitored and `1` not.' }
        site:
          oneOf: [{ $ref: '#/components/schemas/SiteRef' }, { type: 'null' }]
        category: { type: string, description: 'The monitoring template the kind was judged by, or `Other`.' }
        deviceClass: { type: string, description: 'The kind of device, as `class` on `/api/devices`.' }
        triggerids: { type: array, items: { type: string }, description: 'The trigger ids the figure is read from.' }
        sli: { oneOf: [{ type: number }, { type: 'null' }], description: 'Percent. Null when too little data was collected to say.' }
        downtime: { type: number, description: 'Seconds down inside the measured time.' }
        window: { type: number, description: 'Seconds in the window, from its start to now or to its end.' }
        covered: { type: number, description: 'Seconds actually measured: the window minus hours with no data and planned maintenance.' }
        maintenance: { type: number, description: 'Seconds of the window inside planned maintenance, left out of the figure.' }
        coverage: { type: number, description: 'The share of the measurable time that was measured, 0 to 1.' }
        incidents: { type: integer }
        longest: { type: number, description: 'Seconds of the longest outage.' }
        dataStatus: { type: string, enum: [ok, partial, nodata] }
        measured:
          type: boolean
          description: |
            False when the ICMP of this host has never been collected. HCML's method still counts such a
            host as 100 percent. The figures do not change, this only says so.
        meeting: { oneOf: [{ type: boolean }, { type: 'null' }], description: 'Whether `sli` reaches the target.' }
        errorBudget: { oneOf: [{ type: number }, { type: 'null' }], description: 'Seconds of downtime the target still allows. Negative when missed.' }

    SliPath:
      type: object
      description: A redundant pair of WAN links. It is down only while every leg is down.
      required: [key, name, site, legs, sli, downtime, coverage, dataStatus]
      properties:
        key: { type: string }
        name: { type: string }
        site:
          oneOf: [{ $ref: '#/components/schemas/SiteRef' }, { type: 'null' }]
        legs:
          type: array
          items:
            type: object
            required: [hostid, name, leg, sli, dataStatus]
            properties:
              hostid: { type: string }
              name: { type: string }
              leg: { type: string }
              sli: { oneOf: [{ type: number }, { type: 'null' }] }
              dataStatus: { type: string, enum: [ok, partial, nodata] }
        sli: { oneOf: [{ type: number }, { type: 'null' }], description: Percent. }
        downtime: { type: number, description: 'Seconds.' }
        coverage: { type: number, description: '0 to 1.' }
        dataStatus: { type: string, enum: [ok, partial, nodata] }

    SliWeb:
      type: object
      description: One web scenario in the derived monthly report.
      required: [itemid, name, sli, downtime, coverage, dataStatus]
      properties:
        itemid: { type: string }
        name: { type: string }
        sli: { oneOf: [{ type: number }, { type: 'null' }], description: Percent. }
        downtime: { type: number, description: 'Seconds.' }
        coverage: { type: number, description: '0 to 1.' }
        dataStatus: { type: string, enum: [ok, partial, nodata] }

    HostAvailability:
      type: object
      description: One host of the availability report.
      required: [hostid, host, availability, downtime, incidents, longest]
      properties:
        hostid: { type: string }
        host: { type: string }
        availability:
          oneOf: [{ type: number }, { type: 'null' }]
          description: Percent of the measured time with no qualifying problem open. Null means no data.
        downtime: { type: number, description: 'Seconds spent in a problem state, with overlaps merged.' }
        incidents: { type: integer }
        longest: { type: number, description: 'Seconds of the longest outage.' }
        coverage: { type: number, description: 'The share of the measurable time that was measured, 0 to 1. Only with `basis=availability`.' }
        dataStatus: { type: string, enum: [ok, partial, nodata], description: 'Only with `basis=availability`.' }
        category: { type: string, description: 'Only with `basis=availability`.' }
        site:
          oneOf: [{ $ref: '#/components/schemas/SiteRef' }, { type: 'null' }]
          description: Only with `basis=availability`.

    AvailabilityReport:
      type: object
      required: [from, to, windowSeconds, minSeverity, hosts, truncated, basis]
      description: |
        `overall`, `categories`, `sites`, `target`, `profile` and `gaps` are present only when
        `basis=availability`. `truncated` is always false with `basis=availability`. With `basis=all-problems`
        it is true only when more than 200 outages from before the look-back needed a one-by-one lookup
        and the rest were left out, so the figures are a floor. Events are sliced, never silently cut.
        `minSeverity` is the floor the request named. With `basis=availability` it is only echoed back: the figures do not use it.
      properties:
        from: { type: integer }
        to: { type: integer }
        windowSeconds: { type: integer }
        minSeverity: { type: integer }
        hosts: { type: array, items: { $ref: '#/components/schemas/HostAvailability' } }
        truncated: { type: boolean }
        basis: { type: string, enum: [availability, all-problems] }
        profile: { type: string, enum: [availability, hcml-report] }
        month: { oneOf: [{ type: string }, { type: 'null' }] }
        target: { type: number }
        overall: { $ref: '#/components/schemas/SliGroup' }
        categories: { type: array, items: { $ref: '#/components/schemas/SliGroup' } }
        sites: { type: array, items: { $ref: '#/components/schemas/SliGroup' } }
        gaps: { type: array, items: { $ref: '#/components/schemas/Interval' } }
        noDataWindows:
          type: array
          description: Spans declared not measured (SLA_NO_DATA_WINDOWS), in which no downtime is counted.
          items: { $ref: '#/components/schemas/Interval' }

    NoiseReport:
      type: object
      required:
        [from, to, windowSeconds, minSeverity, truncated, totalEvents, distinctTriggers,
         concentration, counts, thresholds, total, triggers]
      properties:
        from: { type: integer }
        to: { type: integer }
        windowSeconds: { type: integer }
        minSeverity: { type: integer }
        truncated: { type: boolean }
        totalEvents: { type: integer }
        distinctTriggers: { type: integer }
        concentration:
          type: object
          required: [topN, percentOfEvents]
          description: 'The Pareto line: N triggers produced X percent of all alerts.'
          properties:
            topN: { type: integer }
            percentOfEvents: { type: number }
        counts:
          type: object
          required: [flapping, unactioned, chronic]
          properties:
            flapping: { type: integer }
            unactioned: { type: integer }
            chronic: { type: integer }
        thresholds:
          type: object
          required: [shortSeconds, minCount]
          properties:
            shortSeconds: { type: integer }
            minCount: { type: integer }
        total: { type: integer, description: Triggers before `top` cut the list. Aggregates cover all. }
        triggers: { type: array, items: { $ref: '#/components/schemas/NoisyTrigger' } }

    NoisyTrigger:
      type: object
      required:
        [objectid, name, host, hostid, severity, count, medianDuration, shortLived, ackRate, totalDuration, longest,
         stillOpen, flags]
      properties:
        objectid: { type: string, description: 'The trigger id.' }
        name: { type: string }
        host: { type: string }
        hostid: { type: string }
        severity: { type: string, enum: ['0', '1', '2', '3', '4', '5'] }
        count: { type: integer, description: 'How many times it fired in the window.' }
        medianDuration: { type: number, description: 'Seconds. The median, so that one long outlier does not hide many short firings.' }
        shortLived: { type: integer, description: 'Firings that cleared before anyone could realistically act.' }
        ackRate: { type: number, description: '0 to 1. Zero across many firings means the team has learned to ignore it.' }
        totalDuration: { type: number, description: 'Seconds.' }
        longest: { type: number, description: 'Seconds.' }
        stillOpen: { type: boolean }
        flags:
          type: array
          items: { type: string, enum: [flapping, unactioned, chronic] }

    AgingReport:
      type: object
      required: [buckets, unacknowledged, total, oldest]
      properties:
        buckets:
          type: array
          minItems: 4
          maxItems: 4
          description: Always exactly four, `Under 1h`, `1–4h`, `4–24h`, `Over 24h`.
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string, enum: ['Under 1h', '1–4h', '4–24h', 'Over 24h'] }
              count: { type: integer }
        unacknowledged: { type: integer, description: 'Open problems nobody has acknowledged. The buckets count these.' }
        total: { type: integer, description: 'Open problems, acknowledged or not.' }
        oldest:
          type: array
          description: The unacknowledged problems that have waited longest, at most 20, oldest first.
          items:
            type: object
            required: [eventid, name, host, severity, clock, ageSeconds]
            properties:
              eventid: { type: string }
              name: { type: string }
              host: { type: string, description: 'An empty string when the problem has no host.' }
              severity: { type: string, enum: ['0', '1', '2', '3', '4', '5'] }
              clock: { type: string, description: 'Epoch seconds the problem began, as Zabbix writes it.' }
              ageSeconds: { type: integer }
      additionalProperties: true

    CapacityReport:
      type: object
      required: [days, metrics, generatedAt]
      properties:
        days: { type: integer }
        generatedAt:
          type: integer
          description: Unix seconds when the report was built. The list of busiest interfaces was chosen at that moment, from the latest rate of each port, and only then ranked by the days.
        metrics:
          type: array
          items:
            type: object
            required: [key, label, rows]
            properties:
              key:
                type: string
                description: 'In practice `cpu`, `memory`, `disk` or `ifutil`; typed open server-side.'
              label: { type: string }
              rows: { type: array, items: { $ref: '#/components/schemas/CapacityRow' } }

    CapacityRow:
      type: object
      required: [metric, label, itemid, hostid, host, name, units, avg, max, source]
      properties:
        metric: { type: string }
        label: { type: string }
        itemid: { type: string }
        hostid: { type: string }
        host: { type: string }
        name: { type: string }
        units: { type: string }
        avg: { type: number, description: Unweighted mean of the hourly averages. }
        max: { type: number }
        source: { type: string, enum: [trend, history, none] }

    ScorecardResponse:
      type: object
      required: [dimensions, overall, groups, gaps]
      properties:
        dimensions:
          type: array
          minItems: 4
          maxItems: 4
          description: Always `naming`, `site`, `owner`, `criticality`, in that order.
          items:
            type: object
            required: [key, label, hint, present, total, pct, scored]
            properties:
              key: { type: string, enum: [naming, site, owner, criticality] }
              label: { type: string }
              hint: { type: string, description: 'Interpolated from env, so not an enumerable constant.' }
              present: { type: integer }
              total: { type: integer }
              pct: { type: number }
              scored: { type: boolean, description: False when this deployment has not configured the check. }
        overall:
          type: object
          required: [hosts, complete, pct]
          properties:
            hosts: { type: integer }
            complete: { type: integer }
            pct: { type: number }
        groups:
          type: array
          items:
            type: object
            required: [name, hosts, complete, pct]
            properties:
              name: { type: string }
              hosts: { type: integer }
              complete: { type: integer }
              pct: { type: number }
        gaps:
          type: array
          items:
            type: object
            required: [hostid, name, site, groups, missing]
            properties:
              hostid: { type: string }
              name: { type: string }
              site: { type: string }
              groups: { type: array, items: { type: string } }
              missing:
                type: array
                items: { type: string, enum: [naming, site, owner, criticality] }

    MapDetail:
      type: object
      description: A Zabbix map as `map.get` returns it, with its elements and links.
      required: [sysmapid, name, width, height, selements, links]
      properties:
        sysmapid: { type: string }
        name: { type: string }
        width: { type: string }
        height: { type: string }
        selements: { type: array, items: { $ref: '#/components/schemas/MapSelement' } }
        links: { type: array, items: { $ref: '#/components/schemas/MapLink' } }
      additionalProperties: true

    MapSelement:
      type: object
      required: [selementid, label, x, y, elementtype, labelText]
      properties:
        selementid: { type: string }
        label: { type: string, description: 'As written in Zabbix, with its macros.' }
        x: { type: string }
        y: { type: string }
        elementtype: { type: string, description: '`0` host, `1` map, `2` trigger, `3` host group, `4` image.' }
        labelText: { type: string, description: 'The label with the host macros expanded.' }
        hostid: { type: string, description: 'Host elements only.' }
        hostName: { type: string, description: 'Host elements only.' }
        problems: { type: integer, description: 'Host elements only. Open problems of the host.' }
        maxSeverity: { type: integer, description: 'Host elements only. The worst open severity, -1 when there is none.' }
      additionalProperties: true

    MapLink:
      type: object
      required: [linkid, selementid1, selementid2]
      properties:
        linkid: { type: string }
        selementid1: { type: string }
        selementid2: { type: string }
        color: { type: string, description: 'Hex without the `#`, as Zabbix stores it.' }
      additionalProperties: true

    ProblemExplanation:
      type: object
      required: [summary, tagsExplained, businessImpact, recommendation]
      properties:
        summary: { type: string }
        tagsExplained:
          type: array
          description: One row for each tag the model was given, so none when the model is outside the machine (SC-72).
          items:
            type: object
            required: [tag, value, meaning]
            properties:
              tag: { type: string }
              value: { type: string }
              meaning: { type: string }
        businessImpact: { type: string }
        recommendation: { type: string }

    SlaAnswer:
      type: object
      required: [status, plain, meetingTarget, recommendation]
      properties:
        status: { type: string }
        plain: { type: string }
        meetingTarget: { type: boolean }
        recommendation: { type: string }
        noData:
          type: boolean
          description: True when there was nothing to measure, so no model call was made.
