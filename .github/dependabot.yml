# Dependabot proposes updates as pull requests; nothing is merged for you.
# github-actions keeps the commit SHAs in .github/workflows current, and docker keeps the image
# digests in both Dockerfiles current, which pinning would otherwise freeze for good.
# npm minor and patch releases come as one pull request a week, so a review is one diff and the
# lockfile moves together; a major release comes alone, because that is the one to read.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # echarts-for-react 3.1.0 added an exports map without ./esm/core, which the chart code imports: eleven suites fail to load. It stays at 3.0.6 until the import is changed (IN-107).
    ignore:
      - dependency-name: echarts-for-react
        update-types: ['version-update:semver-minor']

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  # The model server's image is named in a compose file, docker-compose.vm.yml, which no Dockerfile holds (IN-104). It is a setting there (OLLAMA_IMAGE), so a pull request may not
  # reach the line; the monthly round of docs/handover/4-working/run-it.md names it too.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
