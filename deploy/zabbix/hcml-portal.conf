# The keys that HCML's Zabbix agent (agent or agent 2) reads from the machine that runs the portal. Copy this file into the agent's include folder
# (/etc/zabbix/zabbix_agentd.d/ or /etc/zabbix/zabbix_agent2.d/), change the path to where the folder of the portal is on this machine and the port to the one the web container is published on
# (WEB_PORT in .env, 8082 by default), and restart the agent. The template deploy/zabbix/template-hcml-portal.yaml makes an item of each key. Every probe stops itself after two seconds; the agent waits for 3 unless
# its own Timeout= (1 to 30) says more, so leave that at 3 or raise it, and never set it under 3.
UserParameter=hcml.portal.health,PORTAL_URL=http://127.0.0.1:8082 /opt/hcml-portal-ollama/deploy/portal-probe.sh health
UserParameter=hcml.portal.zabbix,PORTAL_URL=http://127.0.0.1:8082 /opt/hcml-portal-ollama/deploy/portal-probe.sh zabbix
UserParameter=hcml.portal.cert.days[*],/opt/hcml-portal-ollama/deploy/portal-probe.sh cert-days $1 $2
UserParameter=hcml.portal.gpu.temp,/opt/hcml-portal-ollama/deploy/portal-probe.sh gpu-temp
UserParameter=hcml.portal.gpu.mem.pct,/opt/hcml-portal-ollama/deploy/portal-probe.sh gpu-mem-pct
UserParameter=hcml.portal.ollama,/opt/hcml-portal-ollama/deploy/portal-probe.sh ollama
UserParameter=hcml.portal.backup.age[*],/opt/hcml-portal-ollama/deploy/portal-probe.sh backup-age $1
